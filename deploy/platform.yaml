AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DCV 管理平台（管理端）：EC2 运行平台服务，CloudFront VPC 源站提供 HTTPS 访问（源站无公网 IP），
  Cognito 用户池登录。只部署平台本身；DCV 服务器所需的网络、角色、托管组件在平台「系统设置」中初始化。

Parameters:
  VpcMode:
    Type: String
    AllowedValues: [create, existing]
    Default: create
    Description: create = 新建 VPC（公有子网 + NAT + 私有子网）；existing = 使用已有 VPC 的私有子网
  VpcCidr:
    Type: String
    Default: 10.90.0.0/24
    Description: 新建 VPC 的网段（/24 足够，均分为公有、私有子网）
  ExistingVpcId:
    Type: String
    Default: ""
    Description: 已有 VPC（必须挂有互联网网关，CloudFront VPC 源站要求）
  ExistingSubnetId:
    Type: String
    Default: ""
    Description: 已有私有子网（需能通过 NAT 等访问互联网，平台要调用各区域 AWS API）
  InstanceType:
    Type: String
    Default: t4g.small
    Description: 平台服务器机型（ARM）
  ArtifactBucket:
    Type: String
    Description: 平台代码包所在存储桶（deploy.sh 自动创建）
  ArtifactKey:
    Type: String
    Default: dcv-manager/app.tar.gz
  CloudFrontPrefixListId:
    Type: String
    Description: com.amazonaws.global.cloudfront.origin-facing 托管前缀列表 ID（deploy.sh 自动查询）
  # 由 deploy.sh 传入具体 AMI：首次部署取 Amazon Linux 2023 最新版，之后固定沿用，
  # 不随 AWS 发布新 AMI 变化。否则每次部署都会重建平台服务器，而 CloudFront
  # 的 VPC 源站已被分发占用、无法指向新实例，堆栈会更新失败并回滚。
  AmiId:
    Type: AWS::EC2::Image::Id
  DataVolumeGb:
    Type: Number
    Default: 20

Conditions:
  CreateVpc: !Equals [!Ref VpcMode, create]

Resources:
  # ---------------- 网络（新建模式） ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: dcv-manager-platform }]
  Igw:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags: [{ Key: Name, Value: dcv-manager-platform }]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 2, 7]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: dcv-manager-platform-public }]
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 2, 7]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: dcv-manager-platform-private }]
  PublicRt:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: dcv-manager-platform-public }]
  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PublicRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties: { RouteTableId: !Ref PublicRt, SubnetId: !Ref PublicSubnet }
  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateVpc
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: dcv-manager-platform-nat }]
  Nat:
    Type: AWS::EC2::NatGateway
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet
      AllocationId: !GetAtt NatEip.AllocationId
      Tags: [{ Key: Name, Value: dcv-manager-platform }]
  PrivateRt:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: dcv-manager-platform-private }]
  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    Properties: { RouteTableId: !Ref PrivateRt, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  PrivateRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties: { RouteTableId: !Ref PrivateRt, SubnetId: !Ref PrivateSubnet }

  # ---------------- 平台服务器 ----------------
  PlatformSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DCV manager platform - HTTP from CloudFront only
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront VPC origin
      Tags: [{ Key: Name, Value: dcv-manager-platform }]

  PlatformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub dcvmgr-platform-${AWS::Region}   # 不以 dcv- 开头：平台可管理 dcv-* 角色，但不能修改自身权限
      Description: DCV manager platform service role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # 最小权限：按平台功能逐项授权（与 deploy/platform-role-policy.json 一致，由 deploy/render_policy.py 生成）
        # 约定：平台管理的 IAM 角色、函数、规则名称均以 dcv- 开头；DCV 服务器带标签 dcv=true
        - PolicyName: dcv-manager-platform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ---- EC2：只读（发现服务器、容量检测、资源选择）
              - Sid: Ec2Read
                Effect: Allow
                Action: [ec2:Describe*, ec2:GetSpotPlacementScores]
                Resource: "*"
              # ---- EC2：只能操作带 dcv=true 标签的服务器（电源、改机型、快照、删除、标签）
              - Sid: Ec2ManageDcvInstances
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:RebootInstances
                  - ec2:TerminateInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:CreateImage
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:AssociateAddress
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition: { StringEquals: { aws:ResourceTag/dcv: "true" } }
              # ---- EC2：新建服务器时必须带 dcv=true 标签
              - Sid: Ec2RunDcvInstances
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition: { StringEquals: { aws:RequestTag/dcv: "true" } }
              - Sid: Ec2RunInstancesResources
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - arn:aws:ec2:*::image/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:image/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:key-pair/*
              # ---- EC2：创建资源时同时打标签
              - Sid: Ec2TagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - RunInstances
                      - CreateImage
                      - CopyImage
                      - CreateVpc
                      - CreateSubnet
                      - CreateInternetGateway
                      - CreateRouteTable
                      - CreateSecurityGroup
                      - CreateKeyPair
                      - CreateCapacityReservation
              # ---- 快照（AMI）：创建、跨区域复制、给快照打标签、删除平台快照
              - Sid: Ec2Images
                Effect: Allow
                Action: [ec2:CreateImage, ec2:CopyImage, ec2:CreateTags]
                Resource:
                  - arn:aws:ec2:*::image/*
                  - arn:aws:ec2:*::snapshot/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:image/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:snapshot/*
              - Sid: Ec2DeregisterDcvImages
                Effect: Allow
                Action: ec2:DeregisterImage
                Resource: arn:aws:ec2:*::image/*
                Condition: { StringEquals: { aws:ResourceTag/dcv-snapshot: "true" } }
              - Sid: Ec2DeleteImageSnapshots
                # 删除快照时同时删除其 EBS 快照；跨区域复制得到的 EBS 快照没有标签，无法按标签限定
                Effect: Allow
                Action: ec2:DeleteSnapshot
                Resource: arn:aws:ec2:*::snapshot/*
              # ---- 容量实测：创建并立即取消容量预留（只能取消平台创建的）
              - Sid: Ec2CapacityProbe
                Effect: Allow
                Action: ec2:CreateCapacityReservation
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:capacity-reservation/*
                Condition: { StringEquals: { aws:RequestTag/dcv:capacity-probe: "true" } }
              - Sid: Ec2CapacityProbeCancel
                Effect: Allow
                Action: ec2:CancelCapacityReservation
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:capacity-reservation/*
                Condition: { StringEquals: { aws:ResourceTag/dcv:capacity-probe: "true" } }
              # ---- 迁移与删除时转移 / 解除弹性 IP
              - Sid: Ec2ElasticIp
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DisassociateAddress]
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:elastic-ip/*
              # ---- 初始化向导：新建 DCV 网络、安全组、密钥对
              - Sid: Ec2SetupNetwork
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:CreateSubnet
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:CreateRoute
                  - ec2:AssociateRouteTable
                  - ec2:ModifyVpcAttribute
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateSecurityGroup
                  - ec2:CreateKeyPair
                Resource: "*"
              - Sid: Ec2SetupSecurityGroupRules
                # 只能修改向导新建的安全组（带 dcv:managed-by 标签）
                Effect: Allow
                Action: [ec2:AuthorizeSecurityGroupIngress, ec2:AuthorizeSecurityGroupEgress, ec2:RevokeSecurityGroupEgress]
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                Condition: { StringEquals: { aws:ResourceTag/dcv:managed-by: dcv-manager } }
              # ---- SSM：只能对带 dcv=true 标签的服务器下发命令，且只能用 PowerShell 文档
              - Sid: SsmSendCommandToDcv
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition: { StringEquals: { ssm:resourceTag/dcv: "true" } }
              - Sid: SsmSendCommandDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: arn:aws:ssm:*::document/AWS-RunPowerShellScript
              - Sid: SsmRead
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations, ssm:CancelCommand, ssm:DescribeInstanceInformation]
                Resource: "*"
              - Sid: SsmPasswordTransit
                # 重置 DCV 密码时的加密参数（使用 AWS 托管密钥 aws/ssm，无需额外 KMS 权限）
                Effect: Allow
                Action: [ssm:PutParameter, ssm:DeleteParameter]
                Resource: !Sub arn:aws:ssm:*:${AWS::AccountId}:parameter/dcv-manager/*
              # ---- IAM：只读
              - Sid: IamRead
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:GetInstanceProfile
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListRoles
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfiles
                  - iam:ListInstanceProfilesForRole
                  - iam:ListPolicyVersions
                Resource: "*"
              # ---- IAM：只能管理 dcv- 开头的角色与实例配置文件（不能修改平台自身角色 dcvmgr-platform-*）
              - Sid: IamManageDcvRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:TagRole
                  - iam:PutRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:AddRoleToInstanceProfile
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/dcv-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/dcv-*
              - Sid: IamAttachKnownPolicies
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/dcv-*
                Condition:
                  ArnLike:
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - !Sub arn:aws:iam::${AWS::AccountId}:policy/dcv-manager/*
              - Sid: IamPassDcvRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/dcv-*
                Condition:
                  StringEquals:
                    iam:PassedToService: [ec2.amazonaws.com, lambda.amazonaws.com, scheduler.amazonaws.com]
              - Sid: IamSharePolicies
                Effect: Allow
                Action: [iam:CreatePolicy, iam:DeletePolicy, iam:CreatePolicyVersion, iam:DeletePolicyVersion]
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:policy/dcv-manager/*
              # ---- 托管组件：函数 dcv-*、规则 dcv-*、调度组 dcv-manager
              - Sid: LambdaPowerFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:PutFunctionEventInvokeConfig
                  - lambda:TagResource
                Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:function:dcv-*
              - Sid: EventsRules
                Effect: Allow
                Action: [events:PutRule, events:PutTargets, events:ListTargetsByRule, events:DescribeRule]
                Resource: !Sub arn:aws:events:*:${AWS::AccountId}:rule/dcv-*
              - Sid: SchedulerSchedules
                Effect: Allow
                Action: [scheduler:GetSchedule, scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule]
                Resource: !Sub arn:aws:scheduler:*:${AWS::AccountId}:schedule/dcv-manager/*
              - Sid: SchedulerGroup
                Effect: Allow
                Action: [scheduler:GetScheduleGroup, scheduler:CreateScheduleGroup]
                Resource: !Sub arn:aws:scheduler:*:${AWS::AccountId}:schedule-group/dcv-manager
              - Sid: SchedulerList
                Effect: Allow
                Action: scheduler:ListSchedules
                Resource: "*"
              # ---- 运行历史日志
              - Sid: LogsStateHistory
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:PutRetentionPolicy, logs:FilterLogEvents]
                Resource: !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/events/dcv-*
              - Sid: LogsResourcePolicy
                # 允许 EventBridge 写入运行历史日志组（日志资源策略只能按账号级授权）
                Effect: Allow
                Action: [logs:DescribeResourcePolicies, logs:PutResourcePolicy]
                Resource: "*"
              # ---- S3：共享盘存储桶（名称由用户指定）与部署代码包
              - Sid: S3ShareBuckets
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:CreateBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutLifecycleConfiguration
                Resource: "*"
              - Sid: S3Artifact
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactBucket}/dcv-manager/*
              # ---- 只读服务：开机失败记录、机型单价、配额
              - Sid: ReadOnlyServices
                Effect: Allow
                Action: [cloudtrail:LookupEvents, pricing:GetProducts, servicequotas:GetServiceQuota, servicequotas:GetAWSDefaultServiceQuota]
                Resource: "*"
              # ---- 平台用户：只能操作本平台的用户池
              - Sid: CognitoUserPool
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                Resource: !GetAtt UserPool.Arn
      Tags: [{ Key: dcv:managed-by, Value: dcv-manager }]

  PlatformProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub dcvmgr-platform-${AWS::Region}
      Roles: [!Ref PlatformRole]

  PlatformLt:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1 }

  PlatformInstance:
    Type: AWS::EC2::Instance
    DependsOn: [PrivateRtAssoc0]
    CreationPolicy:
      ResourceSignal: { Count: 1, Timeout: PT20M }
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref PlatformProfile
      SubnetId: !If [CreateVpc, !Ref PrivateSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds: [!Ref PlatformSg]
      LaunchTemplate:
        LaunchTemplateId: !Ref PlatformLt
        Version: !GetAtt PlatformLt.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: !Ref DataVolumeGb, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: dcv-manager-platform }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y python3.11 python3.11-pip tar aws-cfn-bootstrap
          id dcvmgr || useradd --system --home-dir /var/lib/dcv-manager --shell /sbin/nologin dcvmgr
          install -d -o dcvmgr -g dcvmgr -m 700 /var/lib/dcv-manager
          install -d -m 755 /opt/dcv-manager /etc/dcv-manager
          cat > /etc/dcv-manager/env <<'EOF'
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          COGNITO_USER_POOL_ID=${UserPool}
          COGNITO_CLIENT_ID=${UserPoolClient}
          DCV_TAG_KEY=dcv
          DCV_TAG_VALUE=true
          DCV_DB_PATH=/var/lib/dcv-manager/data.db
          DCV_SETTINGS_PATH=/var/lib/dcv-manager/settings.json
          EOF
          cat > /opt/dcv-manager/update.sh <<'EOF'
          #!/bin/bash
          # 拉取代码包、安装依赖、重启服务（初次安装与 deploy.sh 更新共用）
          set -euo pipefail
          SRC="s3://${ArtifactBucket}/${ArtifactKey}"
          TMP=$(mktemp -d)
          aws s3 cp "$SRC" "$TMP/app.tar.gz" --region ${AWS::Region}
          mkdir -p "$TMP/app" && tar -xzf "$TMP/app.tar.gz" -C "$TMP/app"
          [ -d /opt/dcv-manager/venv ] || python3.11 -m venv /opt/dcv-manager/venv
          /opt/dcv-manager/venv/bin/pip install --quiet --upgrade pip
          /opt/dcv-manager/venv/bin/pip install --quiet -r "$TMP/app/requirements.txt"
          rm -rf /opt/dcv-manager/app.new && mv "$TMP/app" /opt/dcv-manager/app.new
          rm -rf /opt/dcv-manager/app.old
          [ -d /opt/dcv-manager/app ] && mv /opt/dcv-manager/app /opt/dcv-manager/app.old
          mv /opt/dcv-manager/app.new /opt/dcv-manager/app
          rm -rf "$TMP"
          systemctl restart dcv-manager
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1/ && { echo "UPDATE_OK"; exit 0; }; sleep 2; done
          echo "服务未能启动"; journalctl -u dcv-manager -n 50 --no-pager; exit 1
          EOF
          chmod 755 /opt/dcv-manager/update.sh
          cat > /etc/systemd/system/dcv-manager.service <<'EOF'
          [Unit]
          Description=DCV manager platform
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=dcvmgr
          EnvironmentFile=/etc/dcv-manager/env
          WorkingDirectory=/opt/dcv-manager/app/backend
          ExecStart=/opt/dcv-manager/venv/bin/uvicorn app:app --host 0.0.0.0 --port 80 --proxy-headers --forwarded-allow-ips=*
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/dcv-manager
          ProtectHome=true
          PrivateTmp=true
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable dcv-manager
          /opt/dcv-manager/update.sh && rc=0 || rc=$?
          /opt/aws/bin/cfn-signal -e $rc --stack ${AWS::StackName} --resource PlatformInstance --region ${AWS::Region}

  # 新建模式下等私有路由就绪再启动实例（实例启动即需访问 dnf 与 S3）；已有模式为占位
  PrivateRtAssoc0:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Ready: !If [CreateVpc, !Join [",", [!Ref PrivateRoute, !Ref PrivateRtAssoc]], none]

  # ---------------- 访问入口 ----------------
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub dcv-manager-${AWS::Region}
        Arn: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${PlatformInstance}
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: DCV manager platform
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: platform
            DomainName: !GetAtt PlatformInstance.PrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: platform
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy

  # ---------------- 登录 ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: dcv-manager
      DeletionProtection: INACTIVE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: admin_only, Priority: 1 }]
      UserPoolTags: { "dcv:managed-by": dcv-manager }
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: dcv-manager-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 8
      AccessTokenValidity: 8
      RefreshTokenValidity: 1
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }
  GroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: admin, Description: 管理员, Precedence: 1 }
  GroupOperator:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: operator, Description: 运维, Precedence: 2 }
  GroupViewer:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: viewer, Description: 只读, Precedence: 3 }
  GroupDesktop:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: desktop, Description: 桌面用户（只能开关分配给自己的服务器）, Precedence: 4 }

Outputs:
  Url:
    Value: !Sub https://${Distribution.DomainName}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  PlatformInstanceId:
    Value: !Ref PlatformInstance
  PlatformRoleName:
    Value: !Ref PlatformRole
  VpcId:
    Value: !If [CreateVpc, !Ref Vpc, !Ref ExistingVpcId]
