  const load = useCallback(async (refresh) => { setBusy(true); try { setD(await api(capUrl(region, refresh))); } catch (e) { fail(e.message); } finally { setBusy(false); } }, [region]);
  useEffect(() => { setD(null); setSel([]); }, [region]);
  useEffect(() => { load(false); const t = setInterval(() => load(false), 60000); return () => clearInterval(t); }, [load]);
  const key = (c) => c.az + "|" + c.type;
  const toggle = (c) => { if (!c.offered) return; setSel(sel.includes(key(c)) ? sel.filter(k => k !== key(c)) : [...sel, key(c)]); };
  const probe = async (pairs) => {
    if (!await Confirm.ask({ title: "实测容量", okText: "开始实测", message: `将在 ${pairs.length} 个「可用区 × 机型」组合上创建 ${count} 台的按需容量预留并立即取消，以确认此刻能否开出。\n\n· 每个组合约 2–15 秒，预留存在不到几秒，按秒计费，费用可忽略\n· 结论只代表此刻，GPU 容量随时变化` })) return;
    setProbing(true);
    try { const r = await post("/api/capacity/probe", { pairs: pairs.map(k => k.split("|")), count });
      const bad = r.results.filter(x => !x.ok); ok(`实测完成：${r.results.length - bad.length} 个有容量，${bad.length} 个不足`); setSel([]); await load(true); }
    catch (e) { fail(e.message); } finally { setProbing(false); }
  };
  const regionBar = multiRegion() && <div className="flex flex-wrap items-center gap-2 mb-4"><span className="text-sm text-slate-400">区域</span>
    {CFG.regions.map(r => <button key={r} onClick={() => setRegion(r)} className={`px-3 py-1.5 rounded-lg border text-sm ${region === r ? "border-sky-500 bg-sky-500/10 text-white" : "border-slate-700 text-slate-300"}`}>{regionShort(r)} <span className="text-[11px] text-slate-500">{r}</span>
      <span className="text-[11px] text-slate-400 ml-1">· {allServers.filter(x => x.region === r).length} 台</span></button>)}</div>;
  if (!d) return <div>{regionBar}<div className="text-slate-500 text-center py-16">正在查询 {regionName(region)} 各可用区容量…</div></div>;
  const q = d.quota || {}; const failed = servers.filter(s => s.start_failed);
  return (
    <div className="space-y-4">
      {regionBar}
      <div className="flex items-start justify-between gap-4">
        <div className="text-sm text-slate-400 max-w-4xl">GPU 按需容量随时变化，AWS 不直接公布剩余量。这里综合四类信号判断：<span className="text-slate-300">实测</span>（创建并立即取消容量预留，最准确）、
          <span className="text-slate-300">最近真实开机失败</span>、Spot 放置分数（仅参考）、以及机型在该可用区是否提供。</div>
        <div className="flex items-center gap-2 shrink-0"><span className="text-xs text-slate-500">更新于 {new Date(d.generated_at * 1000).toLocaleTimeString("zh-CN", { hour12: false })}</span>
          <Btn small color="ghost" onClick={() => load(true)} disabled={busy}>{busy ? "刷新中…" : "刷新"}</Btn></div>
      </div>
      {failed.length > 0 && <div className="bg-rose-500/10 border border-rose-500/40 rounded-xl px-4 py-3 text-sm text-rose-200">
        {failed.length} 台服务器最近开机失败（容量不足）：{failed.map(s => `${s.name}（${s.az} ${s.instance_type}）`).join("、")}。可在服务器详情中「改用其他机型开机」。</div>}
      <div className="grid grid-cols-4 gap-3">
        <div className="bg-slate-900 border border-slate-700 rounded-xl p-3"><div className="text-[11px] text-slate-400">G 系列按需 vCPU 配额{multiRegion() ? `（${regionShort(region)}）` : ""}</div>
          {q.error ? <div className="text-xs text-slate-500 mt-1">无法读取</div> : <><div className="text-xl font-semibold mt-0.5">{q.free}<span className="text-sm text-slate-500"> / {q.limit} 可用</span></div>
            <div className="text-[11px] text-slate-500">约可再开 {Math.floor(q.free / 4)} 台 g6f.xlarge；配额不足与容量不足不同，需在 Service Quotas 申请提额</div></>}</div>
        {d.zones.map(z => <div key={z.az} className="bg-slate-900 border border-slate-700 rounded-xl p-3"><div className="text-[11px] text-slate-400">{z.az}</div>
          <div className="text-xl font-semibold mt-0.5">{z.servers}<span className="text-sm text-slate-500"> 台服务器</span></div>
          <div className="text-[11px] text-slate-500">{z.subnet ? `可创建服务器（${z.subnet}）` : "没有可用的公有子网，不能在此创建"}</div></div>)}
      </div>
      <div className="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden">
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-400 border-b border-slate-700"><tr><th className="text-left px-3 py-2 w-36">可用区</th>
            {d.types.map(t => <th key={t.type} className="text-left px-3 py-2">{t.type}<span className="text-slate-500 font-normal ml-1.5">{t.cpu}C / {gib(t.memory_mib)} / 显存 {gib(t.gpu_memory_mib)}</span>
              <div className="font-normal"><PriceTag region={region} type={t.type} compact /></div></th>)}</tr></thead>
          <tbody>{d.zones.map(z => <tr key={z.az} className="border-b border-slate-800">
            <td className="px-3 py-2 align-top font-medium">{z.az}</td>
            {d.types.map(t => { const c = d.cells.find(x => x.az === z.az && x.type === t.type); const [lab, tc, bc] = CAP[c.status]; const on = sel.includes(key(c));
              return <td key={t.type} className="px-2 py-2 align-top">
                <div onClick={() => toggle(c)} className={`rounded-lg border p-2.5 ${bc} ${c.offered ? "cursor-pointer hover:brightness-125" : ""} ${on ? "ring-2 ring-sky-500" : ""}`}>
                  <div className="flex items-center justify-between"><span className={`font-medium ${tc}`}>{lab}</span>
                    {c.offered && c.spot_score != null && <span className="text-[10px] text-slate-500" title="Spot 放置分数 1–10，仅供参考">Spot {c.spot_score}</span>}</div>
                  <div className="text-[11px] text-slate-400 mt-1 leading-snug">{c.reason}</div>
                  {c.servers > 0 && <div className="text-[11px] text-slate-500 mt-1">本区 {c.servers} 台此机型（{c.running} 台运行中）</div>}
                  {c.failures.length > 0 && <div className="text-[11px] text-rose-300/80 mt-1">最近失败：{c.failures.slice(0, 2).map(f => `${new Date(f.time).toLocaleTimeString("zh-CN", { hour12: false })} ${f.source}`).join("，")}</div>}
                </div></td>; })}
          </tr>)}</tbody>
        </table>
      </div>
      {can("operator") && <div className="flex flex-wrap items-center gap-3">
        <span className="text-sm text-slate-400">实测：{sel.length ? `已选 ${sel.length} 个组合` : "点击上方格子选择组合"}</span>
        <label className="text-sm text-slate-400 flex items-center gap-1.5">每个组合台数 <Input type="number" min="1" max="20" value={count} onChange={e => setCount(Math.max(1, Math.min(20, Number(e.target.value) || 1)))} className="w-16" /></label>
        <Btn color="blue" disabled={!sel.length || probing} onClick={() => probe(sel)}>{probing ? "实测中…" : "实测所选"}</Btn>
        <Btn color="ghost" disabled={probing} onClick={() => probe(d.cells.filter(c => c.offered).map(key))}>实测全部可用组合</Btn>
        <span className="text-xs text-slate-500">批量开机或新建前建议按计划台数实测，例如早上 20 台同时开机时填 20。</span>
      </div>}
      <div className="text-xs text-slate-500 space-y-0.5">
        <div>· 已有服务器的系统盘绑定所在可用区，缺货时最快的办法是<span className="text-slate-300">关机状态下改机型</span>（g6f 各规格资源池独立）；换可用区需要快照后重建。</div>
        <div>· 新建服务器时选择「自动选择」或「多可用区均衡分布」，平台按这里的结论排序，某可用区不足时自动换下一个。</div>
        <div>· 关键岗位如需保证随时能开机，可在 AWS 控制台购买按需容量预留（按预留时长计费）。</div>
      </div>
    </div>
  );
}

function CapacityAdvice({ inst, reload }) {
  const [alt, setAlt] = useState(null); const [dlg, setDlg] = useState(false);
  useEffect(() => { api(`/api/instances/${inst.instance_id}/capacity`).then(setAlt).catch(() => {}); }, [inst.instance_id]);
  const good = alt ? alt.change_type.filter(c => ["available", "likely"].includes(c.status)) : [];
  return <div className="bg-rose-500/10 border border-rose-500/40 rounded-lg p-3 text-sm">
    <div className="text-rose-200 font-medium">开机失败：{inst.az} 暂无 {inst.instance_type} 容量</div>
    <div className="text-xs text-slate-300 mt-1.5">{!alt ? "正在查询同可用区其他机型…" : good.length ? <>同可用区可用的机型：{good.map(c => <span key={c.type} className={`mr-2 ${CAP[c.status][1]}`}>{c.type}（{CAP[c.status][0]}）</span>)}</> : "同可用区其他机型当前也紧张，建议稍后重试。"}</div>
    {alt && alt.other_zones.some(c => ["available", "likely"].includes(c.status)) && <div className="text-xs text-slate-400 mt-1">其他可用区有 {inst.instance_type}：{alt.other_zones.filter(c => ["available", "likely"].includes(c.status)).map(c => c.az).join("、")}（需快照后在该可用区重建）</div>}
    {can("operator") && <div className="flex gap-2 mt-2.5"><Btn small color="amber" onClick={() => setDlg("start")}>改用其他机型开机</Btn>
      {can("admin") && <Btn small onClick={() => setDlg("migrate")}>迁移到其他可用区</Btn>}</div>}
    {dlg === "start" && <StartDialog servers={[inst]} preferFallback onClose={() => setDlg(false)} onDone={() => { setDlg(false); setTimeout(reload, 1500); }} />}
    {dlg === "migrate" && <MigrateDialog servers={[inst]} onClose={() => setDlg(false)} onDone={() => { setDlg(false); setTimeout(reload, 1500); }} />}
  </div>;
}

function TypeOrder({ order, setOrder, exclude, az, cap }) {
  const types = ((CFG && CFG.allowed_types) || []).filter(t => !exclude.includes(t));
  const status = (t) => { const c = cap && az && cap.cells.find(x => x.az === az && x.type === t); return c ? CAP[c.status] : null; };
  const move = (i, d) => { const o = [...order]; [o[i], o[i + d]] = [o[i + d], o[i]]; setOrder(o); };
  const rest = types.filter(t => !order.includes(t));
  return <div className="space-y-1">
    {order.map((t, i) => { const st = status(t); return <div key={t} className="flex items-center gap-2 text-sm bg-slate-800/40 rounded px-2 py-1">
      <span className="w-5 text-slate-500">{i + 1}.</span><span className="w-28">{t}</span><PriceTag region={az ? az.replace(/[a-z]$/, "") : null} type={t} base={exclude[0]} compact />
      {st && <span className={`text-xs ${st[1]}`}>{az}：{st[0]}</span>}
      <span className="ml-auto flex gap-1"><Btn small color="ghost" disabled={i === 0} onClick={() => move(i, -1)}>↑</Btn><Btn small color="ghost" disabled={i === order.length - 1} onClick={() => move(i, 1)}>↓</Btn>
        <Btn small color="ghost" onClick={() => setOrder(order.filter(x => x !== t))}>移除</Btn></span></div>; })}
    {!order.length && <div className="text-xs text-slate-500">未选择机型</div>}
    {rest.length > 0 && <div className="flex flex-wrap gap-1.5 pt-1"><span className="text-xs text-slate-500 self-center">添加：</span>{rest.map(t => <Btn key={t} small color="ghost" onClick={() => setOrder([...order, t])}>+ {t}</Btn>)}</div>}
  </div>;
}

function StartDialog({ servers, onClose, onDone, preferFallback }) {
  const stopped = servers.filter(s => s.state === "stopped");
  const [mode, setMode] = useState("server"); const [order, setOrder] = useState(() => (stopped[0] && stopped[0].fallback_types) || []);
  const [cap, setCap] = useState(null); const [busy, setBusy] = useState(false);
  useEffect(() => { const rs = [...new Set(stopped.map(x => x.region))];
    Promise.all(rs.map(r => api(capUrl(r)))).then(ds => setCap({ cells: ds.flatMap(d => d.cells), zones: ds.flatMap(d => d.zones) })).catch(() => {}); }, []);
  const byAz = {}; stopped.forEach(s => { const k = s.az + " " + s.instance_type; byAz[k] = (byAz[k] || 0) + 1; });
  const status = (az, t) => { const c = cap && cap.cells.find(x => x.az === az && x.type === t); return c ? CAP[c.status] : null; };
  const noFb = stopped.filter(s => !s.fallback_types.length);
  const go = async () => {
    setBusy(true);
    try { const r = await post("/api/jobs/power", { instance_ids: servers.map(s => s.instance_id), action: "start", fallback_types: mode === "server" ? null : mode === "custom" ? order : [] });
      ok(`开机任务 #${r.job_id} 已创建，可在「任务中心」查看逐台结果`); onDone(); } catch (e) { fail(e.message); setBusy(false); }
  };
  const R = ({ v, children }) => <label className={`flex items-start gap-2 text-sm cursor-pointer px-3 py-2 rounded-lg border ${mode === v ? "border-sky-500 bg-sky-500/10" : "border-slate-700"}`}><input type="radio" className="mt-0.5" checked={mode === v} onChange={() => setMode(v)} /><div>{children}</div></label>;
  return (
    <Modal title={`开机（${stopped.length} 台）`} onClose={onClose} width="max-w-2xl" footer={<><Btn onClick={onClose}>取消</Btn><Btn color="green" onClick={go} disabled={busy || !stopped.length || (mode === "custom" && !order.length)}>{busy ? "提交中…" : "开机"}</Btn></>}>
      {servers.length > stopped.length && <div className="text-xs text-slate-400 mb-3">{servers.length - stopped.length} 台不是已停止状态，将跳过。</div>}
      {preferFallback && <div className="text-xs text-amber-300 mb-3">上次开机因容量不足失败，建议选择下面的自动换机型方式。</div>}
      <div className="text-xs text-slate-400 mb-1.5">当前容量</div>
      <div className="space-y-1 mb-4">{Object.entries(byAz).map(([k, n]) => { const [az, t] = k.split(" "); const st = status(az, t);
        return <div key={k} className="flex justify-between text-sm bg-slate-800/40 rounded px-3 py-1.5"><span>{az} · {t} · {n} 台</span><span className={st ? st[1] : "text-slate-500"}>{st ? st[0] : "查询中…"}</span></div>; })}</div>
      <div className="text-xs text-slate-400 mb-1.5">容量不足时</div>
      <div className="space-y-2">
        <R v="server">按各服务器的备选机型自动换机型<div className="text-xs text-slate-500 mt-0.5">{stopped.length === 1 ? (stopped[0].fallback_types.join(" → ") || "该服务器未设置备选机型") : `${stopped.length - noFb.length} 台已有备选机型${noFb.length ? `，${noFb.length} 台未设置（不换机型）` : ""}`}。与定时开机规则一致。</div></R>
        <R v="custom">本次指定换机型顺序<div className="text-xs text-slate-500 mt-0.5">只对本次开机生效，不修改服务器设置。</div></R>
        {mode === "custom" && <div className="ml-6"><TypeOrder order={order} setOrder={setOrder} exclude={[...new Set(stopped.map(s => s.instance_type))]} az={stopped[0] && stopped[0].az} cap={cap} /></div>}
        <R v="none">不换机型，只尝试原机型</R>
      </div>
      <div className="text-xs text-slate-500 mt-3">临时换用的机型在关机后自动改回原机型；全部失败时机型保持不变。机型不同会影响 CPU、内存、显存和费用。</div>
    </Modal>
  );
}

function FallbackDialog({ servers, onClose, onDone }) {
  const one = servers.length === 1 ? servers[0] : null;
  const [mode, setMode] = useState(one ? (one.fallback_custom ? (one.fallback_types.length ? "custom" : "none") : "default") : "default");
  const [order, setOrder] = useState(one ? one.fallback_types : []); const [busy, setBusy] = useState(false);
  const types = [...new Set(servers.map(s => s.fallback_from || s.instance_type))];
  const defs = (CFG && CFG.default_fallback) || {};
  const go = async () => {
    setBusy(true);
    try { await post("/api/instances/fallback", { instance_ids: servers.map(s => s.instance_id), types: mode === "default" ? null : mode === "none" ? [] : order });
      ok(`已更新 ${servers.length} 台服务器的备选机型`); onDone(); } catch (e) { fail(e.message); setBusy(false); }
  };
  const R = ({ v, children }) => <label className={`flex items-start gap-2 text-sm cursor-pointer px-3 py-2 rounded-lg border ${mode === v ? "border-sky-500 bg-sky-500/10" : "border-slate-700"}`}><input type="radio" className="mt-0.5" checked={mode === v} onChange={() => setMode(v)} /><div>{children}</div></label>;
  return <Modal title={`备选机型 · ${one ? one.name : servers.length + " 台服务器"}`} onClose={onClose} width="max-w-xl" footer={<><Btn onClick={onClose}>取消</Btn><Btn color="blue" onClick={go} disabled={busy || (mode === "custom" && !order.length)}>保存</Btn></>}>
    <div className="text-sm text-slate-400 mb-3">开机（包括定时开机）时原机型容量不足，按顺序改用下列机型，在同一可用区重试；本次用完关机后自动改回原机型。</div>
    <div className="space-y-2">
      <R v="default">使用默认顺序<div className="text-xs text-slate-500 mt-0.5">{types.map(t => `${t}：${(defs[t] || []).map(x => { const p = priceOf(one ? one.region : null, x); const b = priceOf(one ? one.region : null, t); return x + (p != null && b ? `（${diffPct(p, b) || "同价"}）` : ""); }).join(" → ") || "不换机型"}`).join("；")}</div></R>
      <R v="custom">自定义顺序</R>
      {mode === "custom" && <div className="ml-6"><TypeOrder order={order} setOrder={setOrder} exclude={types} az={one && one.az} cap={null} /></div>}
      <R v="none">不自动换机型<div className="text-xs text-slate-500 mt-0.5">容量不足时直接报开机失败，适合对显卡型号有严格要求的岗位。</div></R>
    </div>
    <div className="text-xs text-slate-500 mt-3">临时机型按其单价计费，括号内为相对原机型的价格差。g4dn 为 T4 显卡（16 GB 显存），g5 为 A10G（24 GB）。首次使用某种备选机型前，建议用快照新建一台该机型测试显卡驱动与 DCV。</div>
  </Modal>;
}

function TerminateDialog({ servers, onClose, onDone }) {
  const conn = servers.filter(x => x.state === "running" && ((x.inspection || {}).connections || 0) > 0);
  const busy = servers.filter(x => x.busy);
  const [backup, setBackup] = useState(false); const [force, setForce] = useState(false);
  const [typed, setTyped] = useState(""); const [sending, setSending] = useState(false);
  const word = servers.length === 1 ? (servers[0].name || servers[0].instance_id) : `删除 ${servers.length} 台`;
  const go = async () => {
    setSending(true);
    try { const r = await post("/api/jobs/terminate", { instance_ids: servers.map(x => x.instance_id), backup, force_connected: force });
      ok(`删除任务 #${r.job_id} 已开始${backup ? "，备份完成后才会删除" : ""}，可在「任务中心」查看`); onDone(); }
    catch (e) { fail(e.message); setSending(false); }
  };
  return <Modal title={`删除服务器（${servers.length} 台）`} onClose={onClose} width="max-w-xl" footer={<><Btn onClick={onClose}>取消</Btn>
      <Btn color="red" onClick={go} disabled={sending || typed !== word || busy.length > 0 || (conn.length > 0 && !force)}>{sending ? "提交中…" : "确认删除"}</Btn></>}>
    <div className="bg-rose-500/10 border border-rose-500/40 rounded-lg px-3 py-2 text-sm text-rose-200 mb-3">
      删除后实例和系统盘无法恢复，服务器上的用户文件会一并删除（共享盘中的文件不受影响）。</div>
    <div className="max-h-40 overflow-auto scrollbar mb-3 space-y-1">{servers.map(x => <div key={x.instance_id} className="flex justify-between text-sm bg-slate-800/40 rounded px-3 py-1.5">
      <span>{x.name || x.instance_id}<span className="text-xs text-slate-500 ml-2">{x.assignee || ""} {multiRegion() ? regionShort(x.region) : ""} {x.instance_type}</span></span>
      <span className="text-xs">{x.busy ? <span className="text-amber-300">有任务进行中</span> : (x.state === "running" && ((x.inspection || {}).connections || 0) > 0) ? <span className="text-rose-300">{x.inspection.connections} 人连接中</span> : <StateDot state={x.state} />}</span></div>)}</div>
    {busy.length > 0 && <div className="text-xs text-amber-300 mb-2">{busy.length} 台有未完成的任务，请等任务结束后再删除。</div>}
    {conn.length > 0 && <label className="flex items-start gap-2 text-sm mb-2 text-rose-200"><input type="checkbox" className="mt-0.5" checked={force} onChange={e => setForce(e.target.checked)} />
      <span>{conn.length} 台有用户正在连接，仍然删除（会立即中断其工作）</span></label>}
    <label className="flex items-start gap-2 text-sm mb-3"><input type="checkbox" className="mt-0.5" checked={backup} onChange={e => setBackup(e.target.checked)} />
      <span>删除前先制作备份快照（推荐）<div className="text-xs text-slate-500">包含全部磁盘，完成后才删除服务器（约 5–20 分钟）。备份显示在「快照与镜像」中，可用来恢复；快照存储约 $0.054/GB·月，按磁盘已用空间计费，不用时可在快照页删除。</div></span></label>
    <div className="text-xs text-slate-400 mb-3">同时会清理：权限模板绑定、自定义权限、共享盘授权、定时任务中的这些服务器（定时任务只剩它们时一并删除）；弹性 IP 会解除关联但保留在账号中。</div>
    <L t={<>请输入 <span className="font-mono text-rose-300">{word}</span> 确认</>}><Input className="w-full" value={typed} onChange={e => setTyped(e.target.value)} autoFocus /></L>
  </Modal>;
}

function MigrateDialog({ servers, onClose, onDone }) {
  const stopped = servers.filter(s => s.state === "stopped");
  const [cap, setCap] = useState(null); const [zone, setZone] = useState("auto"); const [type, setType] = useState("");
  const [delOld, setDelOld] = useState(true); const [keepStopped, setKeepStopped] = useState(false); const [busy, setBusy] = useState(false);
  useEffect(() => { api(capUrl(stopped[0] ? stopped[0].region : null)).then(setCap).catch(e => fail(e.message)); }, []);
  const srcRegions = [...new Set(stopped.map(s => s.region))];
  const srcZones = [...new Set(stopped.map(s => s.az))]; const srcTypes = [...new Set(stopped.map(s => s.fallback_from || s.instance_type))];
  const effType = type || (srcTypes.length === 1 ? srcTypes[0] : "");
  const zones = cap ? cap.zones.filter(z => z.subnet) : [];
  const st = (az) => { const c = cap && effType && cap.cells.find(x => x.az === az && x.type === effType); return c ? (c.offered ? CAP[c.status] : ["不提供", "text-slate-500"]) : null; };
  const go = async () => {
    const msg = `将把 ${stopped.length} 台服务器迁移到${zone === "auto" ? "容量最好的其他可用区" : " " + zone}。\n\n· 先实测目标可用区容量，没容量不会做任何改动\n· 每台约 10–30 分钟，期间无法使用\n· 实例 ID、公网和私网 IP 会变化（弹性 IP 会自动转移），用户需使用新的连接地址\n· 系统盘、DCV 配置、用户文件、权限模板、共享盘、定时任务全部保留\n· ${delOld ? "新服务器验证通过后删除原服务器" : "原服务器保留（已停止，不再纳管）"}；迁移备份镜像保留在「快照与镜像」中`;
    if (!await Confirm.ask({ title: "迁移可用区", message: msg, list: stopped.map(s => `${s.name || s.instance_id}（${s.az}）`), danger: true, okText: "开始迁移", typeToConfirm: stopped.length >= 3 ? String(stopped.length) : null })) return;
    setBusy(true);
    try { const r = await post("/api/jobs/migrate", { instance_ids: stopped.map(s => s.instance_id), target_zone: zone, instance_type: type || null, delete_old: delOld, keep_stopped: keepStopped });
      ok(`迁移任务 #${r.job_id} 已开始，可在「任务中心」查看每台进度`); onDone(); } catch (e) { fail(e.message); setBusy(false); }
  };
  return <Modal title={`迁移可用区（${stopped.length} 台）`} onClose={onClose} width="max-w-2xl" footer={<><Btn onClick={onClose}>取消</Btn><Btn color="blue" onClick={go} disabled={busy || !stopped.length || srcRegions.length > 1}>{busy ? "提交中…" : "开始迁移"}</Btn></>}>
    {servers.length > stopped.length && <div className="text-xs text-amber-300 mb-3">{servers.length - stopped.length} 台未关机，不参与迁移。迁移前请先关机。</div>}
    {srcRegions.length > 1 && <div className="text-sm text-rose-300 mb-3">所选服务器分布在 {srcRegions.map(regionShort).join("、")}，可用区迁移只能在同一区域内进行，请按区域分别迁移。</div>}
    <div className="text-sm text-slate-400 mb-3">{multiRegion() && srcRegions.length === 1 ? `区域 ${regionName(srcRegions[0])}，` : ""}当前位于 {srcZones.join("、") || "—"}，机型 {srcTypes.join("、") || "—"}。适合某个可用区长期缺货；偶尔缺货用「备选机型」更快。</div>
    <div className="text-xs text-slate-400 mb-1.5">目标可用区</div>
    <div className="flex flex-wrap gap-2 mb-4">
      <button onClick={() => setZone("auto")} className={`px-3 py-1.5 rounded-lg border text-sm ${zone === "auto" ? "border-emerald-500 bg-emerald-500/10" : "border-slate-700"}`}>自动选择</button>
      {zones.map(z => { const x = st(z.az); const same = srcZones.length === 1 && srcZones[0] === z.az;
        return <button key={z.az} disabled={same} onClick={() => setZone(z.az)} className={`px-3 py-1.5 rounded-lg border text-sm ${zone === z.az ? "border-emerald-500 bg-emerald-500/10" : "border-slate-700"} ${same ? "opacity-40 cursor-not-allowed" : ""}`}>
          {z.az}{same ? " · 当前" : x ? <span className={`ml-1 ${x[1]}`}>· {x[0]}</span> : ""}</button>; })}
    </div>
    <div className="text-xs text-slate-400 mb-1.5">机型</div>
    <Select value={type} onChange={e => setType(e.target.value)} className="w-full mb-4"><option value="">保持原机型{srcTypes.length === 1 ? `（${srcTypes[0]}）` : ""}</option>{((CFG && CFG.allowed_types) || []).map(t => <option key={t} value={t}>{t}{priceOf(srcRegions[0], t) != null ? ` · ${hourly(priceOf(srcRegions[0], t))}` : ""}</option>)}</Select>
    <label className="flex items-start gap-2 text-sm cursor-pointer mb-2"><input type="checkbox" className="mt-0.5" checked={delOld} onChange={e => setDelOld(e.target.checked)} />
      <span>新服务器验证通过后删除原服务器<div className="text-xs text-slate-500">不勾选则保留原服务器（已停止，不再纳管，磁盘继续计费）。验证未通过时一律保留。</div></span></label>
    <label className="flex items-start gap-2 text-sm cursor-pointer"><input type="checkbox" className="mt-0.5" checked={keepStopped} onChange={e => setKeepStopped(e.target.checked)} />
      <span>迁移完成后关机<div className="text-xs text-slate-500">默认保持开机，用户可以直接使用。</div></span></label>
  </Modal>;
}

function ChangeTypeDialog({ inst, preset, onClose, onDone }) {
  const types = ((CFG && CFG.allowed_types) || []).filter(t => t !== inst.instance_type);
  const [t, setT] = useState(preset || types[0]); const [cap, setCap] = useState(null); const [busy, setBusy] = useState(false);
  useEffect(() => { api(capUrl(inst.region)).then(setCap).catch(() => {}); }, []);
  const go = async () => { setBusy(true); try { await post(`/api/instances/${inst.instance_id}/type`, { instance_type: t }); ok(`已改为 ${t}`); onDone(); } catch (e) { fail(e.message); setBusy(false); } };
  return <Modal title={`更改机型 · ${inst.name}`} onClose={onClose} footer={<><Btn onClick={onClose}>取消</Btn><Btn color="blue" onClick={go} disabled={busy || !t}>确认更改</Btn></>}>
    <div className="text-sm text-slate-400 mb-3">当前 {inst.instance_type}（{hourly(priceOf(inst.region, inst.instance_type))}），位于 {inst.az}。更改后实例 ID、系统盘、权限与共享盘配置不变。</div>
    <div className="space-y-1.5">{types.map(x => { const c = cap && cap.cells.find(y => y.az === inst.az && y.type === x);
      return <label key={x} className={`flex items-center justify-between px-3 py-2 rounded-lg border cursor-pointer ${t === x ? "border-sky-500 bg-sky-500/10" : "border-slate-700"}`}>
        <span className="flex items-center gap-2"><input type="radio" checked={t === x} onChange={() => setT(x)} />{x}<PriceTag region={inst.region} type={x} base={inst.instance_type} compact /></span>
        <span className={`text-xs ${c ? CAP[c.status][1] : "text-slate-500"}`}>{c ? `${inst.az}：${CAP[c.status][0]}` : "…"}</span></label>; })}</div>
  </Modal>;
}

// ============================================================
// 快照与镜像
// ============================================================
const IMG_ST = { available: ["可用", "text-emerald-300"], pending: ["创建中", "text-amber-300"], failed: ["失败", "text-rose-300"] };

function ImagesPage({ servers, templates, summary, reload }) {
  const [data, setData] = useState(null); const [launch, setLaunch] = useState(null); const [pick, setPick] = useState(false); const [snapFor, setSnapFor] = useState(null); const [copy, setCopy] = useState(null);
  const load = useCallback(() => api("/api/images").then(setData).catch(e => fail(e.message)), []);
  const pending = data && data.images.some(i => i.state === "pending");
  useEffect(() => { load(); const t = setInterval(load, pending ? 15000 : 60000); return () => clearInterval(t); }, [load, pending]);
  const remove = async (img) => {
    if (!await Confirm.ask({ title: "删除快照", message: `删除快照「${img.name}」？将同时删除其 EBS 快照，不可恢复。已用它创建的服务器不受影响。`, danger: true, okText: "删除", typeToConfirm: img.name })) return;
    try { await del(`/api/images/${img.image_id}?region=${img.region}`); ok("已删除"); load(); } catch (e) { fail(e.message); }
  };
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <div className="text-sm text-slate-400">快照（AMI 镜像）包含系统盘全部内容：DCV、GPU 驱动、已安装软件。用标准镜像批量创建服务器，保证环境一致。</div>
        {can("operator") && <Btn color="blue" onClick={() => setPick(true)}>从服务器创建快照</Btn>}
      </div>
      <div className="bg-slate-900 border border-slate-700 rounded-xl overflow-hidden">
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-400 border-b border-slate-700"><tr><th className="text-left px-3 py-2">名称</th>{multiRegion() && <th className="text-left px-3">区域</th>}<th className="text-left px-3">状态</th><th className="text-left px-3">来源服务器</th><th className="text-left px-3">大小</th><th className="text-left px-3">创建时间</th><th className="text-right px-3">操作</th></tr></thead>
          <tbody>
            {data && data.images.map(img => <tr key={img.image_id} className="border-b border-slate-800">
              <td className="px-3 py-2.5"><div className="font-medium">{img.name}</div><div className="text-[11px] text-slate-500 font-mono">{img.image_id}{img.description && !img.description.startsWith("DCV snapshot") ? " · " + img.description : ""}</div></td>
              {multiRegion() && <td className="px-3 whitespace-nowrap">{regionShort(img.region)}{img.copied_from && <div className="text-[11px] text-slate-500">复制自 {regionShort(img.copied_from.split("/")[0])}</div>}</td>}
              <td className={`px-3 ${(IMG_ST[img.state] || ["", ""])[1]}`}>{(IMG_ST[img.state] || [img.state])[0]}</td>
              <td className="px-3 text-slate-300">{img.source_name || img.source_instance || "—"}</td><td className="px-3 text-slate-400">{img.size_gb} GiB</td>
              <td className="px-3 text-slate-400 whitespace-nowrap">{fmtT(img.created)}</td>
              <td className="px-3 text-right whitespace-nowrap space-x-1.5">{can("admin") && <><Btn small color="green" disabled={img.state !== "available"} onClick={() => setLaunch(img)}>创建服务器</Btn>
                {multiRegion() && <Btn small color="ghost" disabled={img.state !== "available"} onClick={() => setCopy(img)}>复制到区域</Btn>}<Btn small color="ghost" onClick={() => remove(img)}>删除</Btn></>}</td>
            </tr>)}
            {data && data.images.length === 0 && <tr><td colSpan="6" className="text-center text-slate-500 py-10">暂无快照。把配置好软件的服务器做成快照后，就可以一次创建多台相同的服务器。</td></tr>}
            {!data && <tr><td colSpan="6" className="text-center text-slate-500 py-10">加载中…</td></tr>}
          </tbody>
        </table>
      </div>
      {pick && <Modal title="选择要做快照的服务器" onClose={() => setPick(false)}>
        <div className="space-y-1 max-h-96 overflow-y-auto scrollbar">{servers.map(s => <button key={s.instance_id} onClick={() => { setPick(false); setSnapFor(s); }} className="w-full text-left flex items-center justify-between px-3 py-2 rounded-lg hover:bg-slate-800">
          <span>{s.name || s.instance_id}<span className="text-xs text-slate-500 ml-2">{multiRegion() ? regionShort(s.region) + " · " : ""}{s.group}</span></span><StateDot state={s.state} /></button>)}</div></Modal>}
      {copy && <CopyImageDialog img={copy} images={data ? data.images : []} onClose={() => setCopy(null)} onDone={() => { setCopy(null); load(); }} />}
      {snapFor && <SnapshotDialog inst={snapFor} onClose={() => { setSnapFor(null); setTimeout(load, 2000); }} />}
      {launch && data && <LaunchDialog img={launch} types={data.allowed_types} templates={templates} summary={summary} onClose={() => setLaunch(null)} onDone={() => { setLaunch(null); setTimeout(reload, 3000); }} />}
    </div>
  );
}

function CopyImageDialog({ img, images, onClose, onDone }) {
  const targets = ((CFG && CFG.regions) || []).filter(r => r !== img.region);
  const has = (r) => images.some(x => x.region === r && (x.copied_from === `${img.region}/${img.image_id}` || (x.name === img.name && x.state !== "failed")));
  const [sel, setSel] = useState(targets.filter(r => !has(r))); const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true);
    try { const r = await post(`/api/images/${img.image_id}/copy`, { regions: sel });
      ok(`已开始复制到 ${r.copies.map(c => regionShort(c.region)).join("、")}，约 10–40 分钟完成（状态显示为「创建中」）`); if (r.errors.length) warn(r.errors.join("；")); onDone(); }
    catch (e) { fail(e.message); setBusy(false); }
  };
  return <Modal title={`复制快照到其他区域 · ${img.name}`} onClose={onClose} footer={<><Btn onClick={onClose}>取消</Btn><Btn color="blue" onClick={go} disabled={busy || !sel.length}>开始复制</Btn></>}>
    <div className="text-sm text-slate-400 mb-3">快照是区域级资源。复制到其他区域后，可在那里用同一套系统环境（DCV、驱动、软件）批量创建服务器。源区域：{regionName(img.region)}，大小 {img.size_gb} GiB。</div>
    <div className="space-y-1.5">{targets.map(r => <label key={r} className={`flex items-center justify-between px-3 py-2 rounded-lg border cursor-pointer ${sel.includes(r) ? "border-sky-500 bg-sky-500/10" : "border-slate-700"}`}>
      <span><input type="checkbox" className="mr-2" checked={sel.includes(r)} onChange={() => setSel(toggle(sel, r))} />{regionName(r)}</span>

function Login({ onOk }) {
  const [u, setU] = useState(""); const [p, setP] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [chal, setChal] = useState(null); const [n1, setN1] = useState(""); const [n2, setN2] = useState("");
  const done = (d) => { TOKEN = d.token; ME = { username: d.username, role: d.role }; localStorage.setItem("dcv_token", TOKEN); localStorage.setItem("dcv_me", JSON.stringify(ME)); onOk(); };
  const postJson = async (path, body) => { const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json(); if (!r.ok) throw new Error(d.detail || "操作失败"); return d; };
  const go = async (e) => {
    e.preventDefault(); setBusy(true); setErr("");
    try { const d = await postJson("/api/login", { username: u, password: p }); if (d.challenge === "NEW_PASSWORD_REQUIRED") setChal(d); else done(d); }
    catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  };
  const setNew = async (e) => {
    e.preventDefault(); setErr("");
    if (n1 !== n2) { setErr("两次输入的新密码不一致"); return; }
    if (n1 === p) { setErr("新密码不能与临时密码相同"); return; }
    setBusy(true);
    try { done(await postJson("/api/login/new-password", { username: chal.username, session: chal.session, new_password: n1 })); }
    catch (e2) { setErr(e2.message); } finally { setBusy(false); }
  };
  return <div className="min-h-screen flex items-center justify-center">
    {!chal ? <form onSubmit={go} className="bg-slate-900 border border-slate-700 rounded-2xl p-8 w-96 space-y-3">

const ALL_TYPES = () => [...new Set([...((CFG && CFG.candidate_types) || []), ...((CFG && CFG.allowed_types) || [])])];

// 向导中的通用小组件（定义在组件外，避免输入时重新挂载导致失去焦点）
const Mode = ({ value, onChange, items }) => <div className="flex gap-2 mb-3">{items.map(([v, l]) => <button key={v} onClick={() => onChange(v)} className={`px-3 py-1.5 rounded-lg border text-sm ${value === v ? "border-sky-500 bg-sky-500/10 text-white" : "border-slate-700 text-slate-300"}`}>{l}</button>)}</div>;
const L = ({ t, children, hint }) => <label className="block mb-3"><div className="text-xs text-slate-400 mb-1">{t}</div>{children}{hint && <div className="text-[11px] text-slate-500 mt-1">{hint}</div>}</label>;
const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];

function SetupWizard({ current, onClose, mode = "edit", managed = [], home }) {
  const adding = mode === "add";
  const steps = ["区域", "网络", "安全组", "主机权限", "机型与策略", "确认并执行"];
  const [step, setStep] = useState(0);
  const [region, setRegion] = useState(current.region || ""); const [regions, setRegions] = useState(null); const [makeHome, setMakeHome] = useState(false);
  const [net, setNet] = useState({ mode: "existing", vpc_id: current.vpc_id || "", subnet_ids: current.subnet_ids || [], cidr: "10.80.0.0/16", name: "dcv-vpc", azs: [] });
  const [netInfo, setNetInfo] = useState(null); const [vpcInfo, setVpcInfo] = useState(null);
  const [sg, setSg] = useState({ mode: current.security_group_id ? "existing" : "create", id: current.security_group_id, name: "dcv-servers", cidrs: "0.0.0.0/0",
    rdp: false, rdpCidrs: "", egress: "minimal" });
  const [acc, setAcc] = useState({ profile_mode: current.instance_profile ? "existing" : "create", profile: current.instance_profile, role_name: "dcv-instance-role", key_name: current.key_name });
  const [accInfo, setAccInfo] = useState(null); const [newKey, setNewKey] = useState("dcv-key");
  const [types, setTypes] = useState(current.allowed_types); const [fb, setFb] = useState(current.default_fallback || {});
  const [opt, setOpt] = useState({ scheduler_tz: current.scheduler_tz, inspect_interval_min: current.inspect_interval_min, idle_hours: current.idle_hours, volume_gb: current.volume_gb, deploy: true });
  const [pre, setPre] = useState(null); const [task, setTask] = useState(null); const [busy, setBusy] = useState(false);
  const changedRegion = false;

  useEffect(() => { api("/api/setup/regions").then(d => setRegions(d.regions)).catch(e => fail(e.message)); }, []);
  const [, setPriceTick] = useState(0);
  useEffect(() => { if (!region || PRICES[region]) return;  // 新增区域时单独查询该区域单价
    api(`/api/prices?region=${encodeURIComponent(region)}`).then(d => { PRICES = { ...PRICES, ...(d.prices || {}) }; setPriceTick(x => x + 1); }).catch(() => {}); }, [region]);
  useEffect(() => { if (!region) return; setNetInfo(null); setAccInfo(null);
    api(`/api/setup/network?region=${region}`).then(d => { setNetInfo(d); if (region !== current.region) setNet(n => ({ ...n, vpc_id: "", subnet_ids: [] }));
      setNet(n => ({ ...n, azs: d.zones.filter(z => z.types.some(t => t.startsWith("g6f"))).map(z => z.az) }));
      if (adding) { const def = d.vpcs.find(v => v.default); setNet(n => ({ ...n, vpc_id: def ? def.id : "", subnet_ids: [], mode: d.vpcs.length ? "existing" : "create" })); setSg(x => ({ ...x, id: "" })); setAcc(x => ({ ...x, key_name: "" })); } }).catch(e => fail(e.message));
    api(`/api/setup/access?region=${region}`).then(setAccInfo).catch(e => fail(e.message)); }, [region]);
  useEffect(() => { setVpcInfo(null); if (net.mode === "existing" && net.vpc_id) api(`/api/setup/network?region=${region}&vpc_id=${net.vpc_id}`).then(setVpcInfo).catch(e => fail(e.message)); }, [region, net.vpc_id, net.mode]);
  // 新建 VPC 时只能新建安全组；切回已有 VPC 时恢复为选择已有安全组
  useEffect(() => { setSg(x => ({ ...x, mode: net.mode === "create" ? "create" : (x.id ? "existing" : x.mode) })); }, [net.mode]);
  useEffect(() => { if (vpcInfo && sg.id && !vpcInfo.security_groups.some(g => g.id === sg.id)) setSg(x => ({ ...x, id: "" })); }, [vpcInfo]);

  const offered = useMemo(() => { const r = regions && regions.find(x => x.region === region); return r ? r.types : {}; }, [regions, region]);
  const plan = () => ({ region, network: net.mode === "create" ? { mode: "create", cidr: net.cidr, name: net.name, azs: net.azs } : { mode: "existing", vpc_id: net.vpc_id, subnet_ids: net.subnet_ids },
    security_group: sg.mode === "create" ? { mode: "create", name: sg.name, cidrs: sg.cidrs.split(/[\s,，]+/).filter(Boolean), egress: sg.egress,
      rdp_cidrs: sg.rdp ? sg.rdpCidrs.split(/[\s,，]+/).filter(Boolean) : [] } : { mode: "existing", id: sg.id },
    access: acc.profile_mode === "create" ? { profile_mode: "create", role_name: acc.role_name, key_name: acc.key_name } : { profile_mode: "existing", profile: acc.profile, key_name: acc.key_name },
    allowed_types: types, default_fallback: Object.fromEntries(types.map(t => [t, (fb[t] || []).filter(x => types.includes(x) && x !== t)])),
    scheduler_tz: opt.scheduler_tz, inspect_interval_min: Number(opt.inspect_interval_min), idle_hours: Number(opt.idle_hours), volume_gb: Number(opt.volume_gb), deploy: opt.deploy,
    home_region: makeHome ? region : null });
  const stepOk = [!!region && (!adding || !managed.includes(region)), net.mode === "create" ? (net.azs.length > 0 && !!net.cidr) : (!!net.vpc_id && net.subnet_ids.length > 0),
    sg.mode === "create" ? (!!sg.cidrs.trim() && (!sg.rdp || !!sg.rdpCidrs.trim())) : !!sg.id, (acc.profile_mode === "create" || !!acc.profile) && !!acc.key_name, types.length > 0, true];
  const goNext = async () => { if (step === 4) { setPre(null); setStep(5); try { setPre(await post("/api/setup/check", plan())); } catch (e) { fail(e.message); } } else setStep(step + 1); };
  const makeKey = async () => {
    try { const r = await post("/api/setup/key", { region, name: newKey });
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.private_key], { type: "application/x-pem-file" })); a.download = `${r.name}.pem`; a.click();
      ok(`密钥对 ${r.name} 已创建，私钥已下载（平台不保存，请妥善保管）`); setAcc(x => ({ ...x, key_name: r.name }));
      setAccInfo(await api(`/api/setup/access?region=${region}`)); } catch (e) { fail(e.message); }
  };
  const run = async () => {
    const msg = `${adding ? "新增管理区域" : "更新区域"} ${regionName(region)}：\n· 网络：${net.mode === "create" ? `新建 VPC ${net.cidr}（${net.azs.length} 个可用区的公有子网）` : `使用 ${net.vpc_id}`}\n· 安全组：${sg.mode === "create" ? "新建，仅放行 DCV 端口" : `使用 ${sg.id}`}\n· 实例角色：${acc.profile_mode === "create" ? `新建 ${acc.role_name}` : acc.profile}\n${opt.deploy ? "· 部署/更新托管组件：定时任务角色与调度组、运行历史、托管开机函数\n" : ""}· 保存设置后平台自动重启（约 5 秒）` + `\n\n其他已管理区域（${managed.filter(r => r !== region).map(regionShort).join("、") || "无"}）不受影响。机型与策略为全局设置，对所有区域生效。`;
    if (!await Confirm.ask({ title: adding ? "新增区域" : "更新区域设置", message: msg, okText: "开始执行" })) return;
    setBusy(true);
    try { const r = await post("/api/setup/apply", plan()); poll(r.task_id); } catch (e) { fail(e.message); setBusy(false); }
  };
  const poll = (id) => { const tick = async () => { try { const t = await api(`/api/setup/tasks/${id}`); setTask(t);
      if (t.status === "running") setTimeout(tick, 1500); else if (t.status === "success") waitRestart(); else setBusy(false); } catch (e) { setTimeout(tick, 2000); } }; tick(); };
  const waitRestart = () => { setTimeout(async function again() { try { await api("/api/config"); ok("设置已生效"); setTimeout(() => location.reload(), 800); } catch { setTimeout(again, 1500); } }, 4000); };


  return <Modal title={`${adding ? "新增区域" : `区域设置 · ${regionShort(region)}`} · ${steps[step]}`} onClose={busy ? () => {} : onClose} width="max-w-4xl" footer={task ? <Btn onClick={onClose} disabled={busy}>关闭</Btn> : <>
      <span className="mr-auto text-xs text-slate-500">第 {step + 1} / {steps.length} 步</span>
      <Btn onClick={() => step ? setStep(step - 1) : onClose()}>{step ? "上一步" : "取消"}</Btn>
      {step < 5 ? <Btn color="blue" onClick={goNext} disabled={!stepOk[step]}>下一步</Btn> : <Btn color="green" onClick={run} disabled={busy || !pre || pre.errors.length > 0}>执行</Btn>}</>}>
    <div className="flex gap-1 mb-4">{steps.map((x, i) => <div key={x} className={`flex-1 text-center text-[11px] py-1 rounded ${i === step ? "bg-sky-600 text-white" : i < step ? "bg-slate-700 text-slate-200" : "bg-slate-800 text-slate-500"}`}>{i + 1}. {x}</div>)}</div>

    {step === 0 && <div>
      <div className="text-sm text-slate-400 mb-3">{adding ? "选择要新增管理的区域。建议选离用户最近、且至少两个可用区提供 g6f 的区域。已管理的区域不可再选。" : `正在修改 ${regionName(region)} 的设置。要管理其他区域请使用「新增区域」。`}</div>
      {!regions ? <div className="text-slate-500 text-sm py-6 text-center">正在查询各区域的 GPU 机型…</div> :
        <div className="grid grid-cols-3 gap-2 max-h-96 overflow-auto scrollbar pr-1">{regions.map(r => { const g6f = (r.types["g6f.xlarge"] || []).length; const g4 = (r.types["g4dn.xlarge"] || []).length;
          const locked = adding ? r.managed : r.region !== region;
          return <button key={r.region} disabled={locked} onClick={() => setRegion(r.region)} className={`text-left rounded-lg border p-2.5 ${region === r.region ? "border-sky-500 bg-sky-500/10" : "border-slate-700 hover:border-slate-500"} ${locked ? "opacity-40 cursor-not-allowed" : ""}`}>
            <div className="text-sm font-medium">{regionShort(r.region)} <span className="text-[11px] text-slate-500 font-normal">{r.region}</span>{r.managed && <span className="text-[10px] text-sky-300 ml-1.5">{r.current ? "主区域" : "已管理"}</span>}</div>
            <div className={`text-[11px] mt-0.5 ${g6f ? "text-emerald-300" : "text-slate-500"}`}>{r.error ? "无法查询（可能未启用）" : g6f ? `g6f：${g6f} 个可用区` : "不提供 g6f"}{g4 ? ` · g4dn：${g4}` : ""}</div></button>; })}</div>}
      {region && region !== home && <label className="flex items-center gap-2 text-sm mt-3"><input type="checkbox" checked={makeHome} onChange={e => setMakeHome(e.target.checked)} />设为主区域（平台默认显示的区域，新建共享盘存储桶默认放在这里）</label>}
    </div>}

    {step === 1 && <div>
      <Mode value={net.mode} onChange={v => setNet({ ...net, mode: v })} items={[["existing", "使用已有 VPC"], ["create", "新建 VPC"]]} />
      {!netInfo ? <div className="text-slate-500 text-sm">加载中…</div> : net.mode === "existing" ? <>
        <L t="VPC"><Select className="w-full" value={net.vpc_id} onChange={e => setNet({ ...net, vpc_id: e.target.value, subnet_ids: [] })}><option value="">请选择</option>
          {netInfo.vpcs.map(v => <option key={v.id} value={v.id}>{v.name || "(无名称)"} · {v.id} · {v.cidr}{v.default ? " · 默认 VPC" : ""}</option>)}</Select></L>
        {net.vpc_id && <><div className="text-xs text-slate-400 mb-1">子网（每个可用区选一个；只能选公有子网，服务器需要公网访问 SSM 和用户连接）</div>
          {!vpcInfo ? <div className="text-slate-500 text-sm">加载中…</div> : <table className="w-full text-sm"><thead className="text-[11px] text-slate-500"><tr><th></th><th className="text-left py-1">子网</th><th className="text-left">可用区</th><th className="text-left">网段</th><th className="text-left">剩余 IP</th><th className="text-left">类型</th><th className="text-left">提供的机型</th></tr></thead>
            <tbody>{vpcInfo.subnets.map(x => { const on = net.subnet_ids.includes(x.id); const dupAz = !on && net.subnet_ids.some(id => (vpcInfo.subnets.find(y => y.id === id) || {}).az === x.az);
              return <tr key={x.id} className={`border-t border-slate-800 ${!x.public ? "opacity-50" : ""}`}>
                <td className="py-1.5 pr-2"><input type="checkbox" disabled={!x.public || dupAz} checked={on} onChange={() => setNet({ ...net, subnet_ids: toggle(net.subnet_ids, x.id) })} /></td>
                <td><div className="font-mono text-xs">{x.id}</div><div className="text-[11px] text-slate-500">{x.name}</div></td><td>{x.az}</td><td className="text-xs">{x.cidr}</td><td>{x.free_ips}</td>
                <td className={x.public ? "text-emerald-300" : "text-slate-500"}>{x.public ? "公有" : "私有"}</td>
                <td className="text-[11px]">{x.types.filter(t => t.startsWith("g6f")).length ? <span className="text-emerald-300">g6f</span> : <span className="text-slate-500">无 g6f</span>}{x.types.filter(t => !t.startsWith("g6f")).length > 0 && <span className="text-slate-400"> · {x.types.filter(t => !t.startsWith("g6f")).join("、")}</span>}</td></tr>; })}</tbody></table>}</>}
      </> : <>
        <div className="grid grid-cols-2 gap-3"><L t="名称"><Input className="w-full" value={net.name} onChange={e => setNet({ ...net, name: e.target.value })} /></L>
          <L t="VPC 网段" hint="不要与公司内网或其他 VPC 重叠（以后若需打通专线/VPN）"><Input className="w-full" value={net.cidr} onChange={e => setNet({ ...net, cidr: e.target.value })} /></L></div>
        <div className="text-xs text-slate-400 mb-1.5">可用区（每个可用区创建一个公有子网、共用一个互联网网关）</div>
        <div className="flex flex-wrap gap-2">{netInfo.zones.map(z => <label key={z.az} className={`px-3 py-2 rounded-lg border text-sm cursor-pointer ${net.azs.includes(z.az) ? "border-sky-500 bg-sky-500/10" : "border-slate-700"}`}>
          <input type="checkbox" className="mr-2" checked={net.azs.includes(z.az)} onChange={() => setNet({ ...net, azs: toggle(net.azs, z.az) })} />{z.az}
          <div className={`text-[11px] ${z.types.some(t => t.startsWith("g6f")) ? "text-emerald-300" : "text-slate-500"}`}>{z.types.length ? z.types.join("、") : "不提供所选机型"}</div></label>)}</div>
      </>}
    </div>}

    {step === 2 && <div>
      <Mode value={sg.mode} onChange={v => setSg({ ...sg, mode: v })} items={net.mode === "create" ? [["create", "新建安全组"]] : [["existing", "使用已有安全组"], ["create", "新建安全组"]]} />
      {sg.mode === "existing" ? (!vpcInfo ? <div className="text-slate-500 text-sm">加载中…</div> :
        <div className="space-y-1.5 max-h-80 overflow-auto scrollbar">{vpcInfo.security_groups.map(g => <label key={g.id} className={`flex items-start gap-2 px-3 py-2 rounded-lg border cursor-pointer ${sg.id === g.id ? "border-sky-500 bg-sky-500/10" : "border-slate-700"}`}>
          <input type="radio" className="mt-1" checked={sg.id === g.id} onChange={() => setSg({ ...sg, id: g.id })} />
          <div className="text-sm"><span className="font-medium">{g.name}</span> <span className="font-mono text-xs text-slate-500">{g.id}</span>
            <div className={`text-[11px] ${g.dcv_tcp.length ? (g.open_world ? "text-amber-300" : "text-emerald-300") : "text-rose-300"}`}>{g.dcv_tcp.length ? `DCV ${CFG ? CFG.dcv_port : 8443}/TCP 来源：${g.dcv_tcp.join(", ")}${g.dcv_udp.length ? "；UDP 已放行" : "；UDP 未放行"}${g.open_world ? "（对全互联网开放）" : ""}` : "未放行 DCV 端口，不能使用"}</div></div></label>)}</div>) : <>
        <L t="名称"><Input className="w-64" value={sg.name} onChange={e => setSg({ ...sg, name: e.target.value })} /></L>
        <L t="允许连接 DCV 的来源网段（每行或逗号分隔）" hint="建议填写公司办公网出口 IP（例如 203.0.113.10/32）。">
          <textarea className="w-full h-16 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm font-mono outline-none focus:border-sky-500" value={sg.cidrs} onChange={e => setSg({ ...sg, cidrs: e.target.value })} /></L>
        {/0\.0\.0\.0\/0/.test(sg.cidrs) && <div className="text-xs text-amber-300 -mt-2 mb-3">0.0.0.0/0 表示任何人都能访问 DCV 登录页（仍需 Windows 账号密码），企业环境建议限制来源。</div>}
        <label className="flex items-center gap-2 text-sm mb-2"><input type="checkbox" checked={sg.rdp} onChange={e => setSg({ ...sg, rdp: e.target.checked })} />开放 RDP 3389（仅维护时使用，日常运维通过 SSM，默认不开放）</label>
        {sg.rdp && <L t="RDP 来源网段（不能为 0.0.0.0/0）"><Input className="w-full font-mono" placeholder="例如 203.0.113.10/32" value={sg.rdpCidrs} onChange={e => setSg({ ...sg, rdpCidrs: e.target.value })} /></L>}
        <div className="text-xs text-slate-400 mt-3 mb-1.5">出站规则</div>
        <div className="flex gap-2 mb-3">{[["minimal", "按平台功能最小放行（推荐）"], ["all", "放行全部出站"]].map(([v, l]) => <button key={v} onClick={() => setSg({ ...sg, egress: v })}
          className={`px-3 py-1.5 rounded-lg border text-sm ${sg.egress === v ? "border-sky-500 bg-sky-500/10 text-white" : "border-slate-700 text-slate-300"}`}>{l}</button>)}</div>
        {sg.egress === "all" && <div className="text-xs text-slate-500 mb-2">服务器上的业务软件需要访问其他端口（例如许可证服务器、数据库）时选择此项。</div>}
        <div className="text-xs text-slate-400 mb-1">将要创建的规则</div>
        <table className="w-full text-xs border border-slate-700 rounded-lg overflow-hidden"><thead className="bg-slate-800/60 text-slate-400"><tr><th className="text-left px-2 py-1.5">方向</th><th className="text-left px-2">协议 / 端口</th><th className="text-left px-2">来源 / 目标</th><th className="text-left px-2">用途</th></tr></thead>
          <tbody>
            {[["tcp", "DCV 连接（TCP）"], ["udp", "DCV 连接（QUIC / UDP，画面更流畅）"]].map(([pr, u]) => <tr key={pr} className="border-t border-slate-800"><td className="px-2 py-1.5">入站</td><td className="px-2 font-mono">{pr.toUpperCase()} {CFG ? CFG.dcv_port : 8443}</td><td className="px-2 font-mono">{sg.cidrs.split(/[\s,，]+/).filter(Boolean).join(", ") || "—"}</td><td className="px-2 text-slate-400">{u}</td></tr>)}
            {sg.rdp && <tr className="border-t border-slate-800"><td className="px-2 py-1.5">入站</td><td className="px-2 font-mono">TCP 3389</td><td className="px-2 font-mono">{sg.rdpCidrs || "—"}</td><td className="px-2 text-slate-400">RDP 维护</td></tr>}
            {sg.egress === "minimal" ? ((netInfo && netInfo.sg_template) ? netInfo.sg_template.egress_minimal : []).map(r => <tr key={r.port} className="border-t border-slate-800"><td className="px-2 py-1.5">出站</td><td className="px-2 font-mono">{r.proto.toUpperCase()} {r.port}</td><td className="px-2 font-mono">{r.cidrs.join(", ")}</td><td className="px-2 text-slate-400">{r.purpose}</td></tr>)
              : <tr className="border-t border-slate-800"><td className="px-2 py-1.5">出站</td><td className="px-2 font-mono">全部</td><td className="px-2 font-mono">0.0.0.0/0</td><td className="px-2 text-slate-400">不限制</td></tr>}
          </tbody></table>
        <div className="text-[11px] text-slate-500 mt-1.5">安全组有状态：入站连接的回包自动放行；VPC DNS 与实例元数据不受安全组限制。</div>
      </>}
    </div>}

    {step === 3 && <div>
      <div className="text-xs text-slate-400 mb-1.5">实例角色（服务器通过它接受 SSM 远程管理、访问共享盘）</div>
      <Mode value={acc.profile_mode} onChange={v => setAcc({ ...acc, profile_mode: v })} items={[["existing", "使用已有"], ["create", "新建"]]} />
      {acc.profile_mode === "existing" ? (!accInfo ? <div className="text-slate-500 text-sm">加载中…</div> :
        <Select className="w-full mb-4" value={acc.profile} onChange={e => setAcc({ ...acc, profile: e.target.value })}><option value="">请选择</option>
          {[...accInfo.profiles].sort((a, b) => (b.manageable - a.manageable)).map(p => <option key={p.name} value={p.name} disabled={!p.manageable}>{p.name} → {p.role || "无角色"}{!p.manageable ? "（角色名不以 dcv- 开头，平台权限无法使用）" : p.ssm ? "（有 SSM 权限）" : "（缺少 SSM 权限，执行时会自动附加）"}</option>)}</Select>) :
        <L t="角色名称" hint="创建同名角色与实例配置文件，附加 AmazonSSMManagedInstanceCore；共享盘权限由平台按需追加。"><Input className="w-64" value={acc.role_name} onChange={e => setAcc({ ...acc, role_name: e.target.value })} /></L>}
      <div className="text-xs text-slate-400 mb-1.5 mt-2">密钥对（用于解密 Windows 管理员初始密码；平台日常运维不需要）</div>
      {!accInfo ? null : <div className="flex flex-wrap items-center gap-2">
        <Select value={acc.key_name} onChange={e => setAcc({ ...acc, key_name: e.target.value })}><option value="">请选择</option>{accInfo.keys.map(k => <option key={k.name}>{k.name}</option>)}</Select>
        <span className="text-xs text-slate-500">或新建：</span><Input className="w-40" value={newKey} onChange={e => setNewKey(e.target.value)} /><Btn small onClick={makeKey}>新建并下载私钥</Btn></div>}
      {acc.key_name && !(accInfo && accInfo.keys.some(k => k.name === acc.key_name)) && <div className="text-xs text-rose-300 mt-1">{region} 中不存在密钥对 {acc.key_name}</div>}
    </div>}

    {step === 4 && <div className="grid grid-cols-2 gap-5">
      <div><div className="text-xs text-slate-400 mb-1.5">允许使用的机型（创建、改机型、备选机型只能在这些中选择）</div>
        <div className="space-y-1">{ALL_TYPES().map(t => { const zs = offered[t] || []; return <label key={t} className={`flex items-center gap-2 text-sm px-2 py-1 rounded ${zs.length ? "" : "opacity-40"}`}>
          <input type="checkbox" disabled={!zs.length && !types.includes(t)} checked={types.includes(t)} onChange={() => setTypes(toggle(types, t))} /><span className="w-28">{t}</span>
          <span className="text-[11px] text-slate-500 w-20">{zs.length ? `${zs.length} 个可用区` : "本区域不提供"}</span>{zs.length > 0 && <PriceTag region={region} type={t} compact />}</label>; })}</div>
        <div className="text-[11px] text-slate-500 mt-1">单价为 Windows 按需价格，不含磁盘、公网 IP 与流量。</div></div>
      <div><div className="text-xs text-slate-400 mb-1.5">默认备选机型顺序（容量不足时依次尝试，可在每台服务器单独覆盖）</div>
        {types.map(t => { const bad = (fb[t] || []).filter(x => x === t || !types.includes(x));
          return <L key={t} t={t} hint={bad.length ? <span className="text-amber-300">{bad.map(x => x === t ? `${x} 与原机型相同` : `${x} 未在左侧勾选`).join("；")}，保存时会被忽略</span> : ""}>
            <Input className="w-full" placeholder="例如 g4dn.xlarge, g5.xlarge；留空表示不换机型" value={(fb[t] || []).join(", ")}
              onChange={e => setFb({ ...fb, [t]: e.target.value.split(/[\s,，]+/).filter(Boolean) })} /></L>; })}
        <div className="grid grid-cols-2 gap-3 mt-2">
          <L t="系统盘（GB）"><Input type="number" className="w-full" value={opt.volume_gb} onChange={e => setOpt({ ...opt, volume_gb: e.target.value })} /></L>
          <L t="定时任务时区"><Input className="w-full" value={opt.scheduler_tz} onChange={e => setOpt({ ...opt, scheduler_tz: e.target.value })} /></L>
          <L t="后台巡检间隔（分钟，0 关闭）"><Input type="number" className="w-full" value={opt.inspect_interval_min} onChange={e => setOpt({ ...opt, inspect_interval_min: e.target.value })} /></L>
          <L t="闲置提醒（小时）"><Input type="number" className="w-full" value={opt.idle_hours} onChange={e => setOpt({ ...opt, idle_hours: e.target.value })} /></L></div>
        <label className="flex items-start gap-2 text-sm mt-1"><input type="checkbox" className="mt-0.5" checked={opt.deploy} onChange={e => setOpt({ ...opt, deploy: e.target.checked })} />
          <span>部署或更新托管组件<div className="text-[11px] text-slate-500">定时任务执行角色与调度组、运行历史（EventBridge → CloudWatch Logs）、托管开机函数与关机改回规则。均为按量计费的无服务器资源，日常费用可忽略。</div></span></label></div>
    </div>}

    {step === 5 && <div>
      {!task && <>
        <div className="text-sm text-slate-400 mb-2">预检结果（新建的资源在执行时创建）：</div>
        {!pre ? <div className="text-slate-500 text-sm py-4">检查中…</div> : <>
          {pre.errors.length > 0 && <div className="bg-rose-500/10 border border-rose-500/40 rounded-lg px-3 py-2 text-sm text-rose-200 mb-2">{pre.errors.join("；")}</div>}
          <CheckList checks={pre.checks} /></>}
      </>}
      {task && <div>
        <div className={`text-sm mb-2 ${task.status === "failed" ? "text-rose-300" : task.status === "success" ? "text-emerald-300" : "text-sky-300"}`}>
          {task.status === "running" ? "执行中…" : task.status === "success" ? "完成，平台正在重启，稍后自动刷新…" : `失败：${task.error}`}</div>
        <pre className="bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs whitespace-pre-wrap max-h-96 overflow-auto scrollbar text-slate-300">{task.log.map(l => `${new Date(l.t * 1000).toLocaleTimeString("zh-CN", { hour12: false })}  ${l.msg}`).join("\n")}</pre>
      </div>}
    </div>}
  </Modal>;
}

function App() {
  const [authed, setAuthed] = useState(!!TOKEN && !!ME);
  useEffect(() => { const h = () => setAuthed(false); window.addEventListener("dcv-logout", h); return () => window.removeEventListener("dcv-logout", h); }, []);
  return <>{authed ? <Shell /> : <Login onOk={() => setAuthed(true)} />}<Toasts /><ConfirmHost /></>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
