<body class="text-slate-100">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ============================================================
// 基础：接口、格式化、会话
// ============================================================
let TOKEN = localStorage.getItem("dcv_token") || "";
let ME = JSON.parse(localStorage.getItem("dcv_me") || "null");
const RANK = { viewer: 0, operator: 1, admin: 2 };
const ROLE_ZH = { viewer: "只读", operator: "运维", admin: "管理员" };
const can = (r) => ME && RANK[ME.role] >= RANK[r];

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (TOKEN) { headers["Authorization"] = "Bearer " + TOKEN; headers["X-Auth-Token"] = TOKEN; }
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { logout(); throw new Error("登录已过期，请重新登录"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : ("请求失败 " + res.status));
  return data;
}
const post = (p, b) => api(p, { method: "POST", body: JSON.stringify(b || {}) });
const put = (p, b) => api(p, { method: "PUT", body: JSON.stringify(b || {}) });
const del = (p) => api(p, { method: "DELETE" });
function logout() { TOKEN = ""; ME = null; localStorage.removeItem("dcv_token"); localStorage.removeItem("dcv_me"); window.dispatchEvent(new Event("dcv-logout")); }

const fmtT = (v) => { if (!v) return "—"; const d = typeof v === "number" ? new Date(v * 1000) : new Date(v); return d.toLocaleString("zh-CN", { hour12: false }); };
const fmtRel = (ts) => { if (!ts) return "—"; const s = Math.max(0, Date.now() / 1000 - ts); if (s < 60) return "刚刚"; if (s < 3600) return Math.floor(s / 60) + " 分钟前"; if (s < 86400) return Math.floor(s / 3600) + " 小时前"; return Math.floor(s / 86400) + " 天前"; };
function fmtDur(sec) { if (sec === null || sec === undefined) return "—"; sec = Math.max(0, Math.floor(sec)); const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60); const p = []; if (d) p.push(d + "天"); if (h || d) p.push(h + "小时"); p.push(m + "分"); return p.join(""); }
const uptimeOf = (inst) => inst.state === "running" && inst.running_since ? fmtDur((Date.now() - new Date(inst.running_since)) / 1000) : "—";
const gib = (mib) => mib ? (mib / 1024).toFixed(mib % 1024 === 0 ? 0 : 1) + " GiB" : "—";
const pct = (a, b) => (a !== null && a !== undefined && b) ? Math.round(a * 100 / b) : null;

// ============================================================
// 通用组件
// ============================================================
function Btn({ children, onClick, color = "slate", disabled, small, title, type }) {
  const c = { slate: "bg-slate-700 hover:bg-slate-600", green: "bg-emerald-600 hover:bg-emerald-500", red: "bg-rose-600 hover:bg-rose-500", amber: "bg-amber-600 hover:bg-amber-500", blue: "bg-sky-600 hover:bg-sky-500", indigo: "bg-indigo-600 hover:bg-indigo-500", ghost: "bg-transparent hover:bg-slate-800 border border-slate-700" };
  return <button type={type||"button"} title={title} onClick={onClick} disabled={disabled} className={`${c[color]} ${small ? "px-2.5 py-1 text-xs" : "px-3.5 py-1.5 text-sm"} rounded-lg font-medium disabled:opacity-40 disabled:cursor-not-allowed transition whitespace-nowrap`}>{children}</button>;
}

function Modal({ title, onClose, children, width = "max-w-xl", footer }) {
  useEffect(() => { const h = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onMouseDown={onClose}>
      <div className={`bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl ${width} w-full max-h-[90vh] flex flex-col`} onMouseDown={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-3.5 border-b border-slate-700">
          <h3 className="font-semibold">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none">×</button>
        </div>
        <div className="p-5 overflow-y-auto scrollbar">{children}</div>
        {footer && <div className="px-5 py-3 border-t border-slate-700 flex justify-end gap-2">{footer}</div>}
      </div>
    </div>
  );
}

function Drawer({ title, sub, onClose, children }) {
  useEffect(() => { const h = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return (
    <div className="fixed inset-0 z-40 flex justify-end bg-black/40" onMouseDown={onClose}>
      <div className="w-full max-w-3xl h-full bg-slate-900 border-l border-slate-700 flex flex-col shadow-2xl" onMouseDown={e => e.stopPropagation()}>
        <div className="flex items-start justify-between px-5 py-4 border-b border-slate-700">
          <div className="min-w-0"><div className="font-semibold text-lg truncate">{title}</div>{sub && <div className="text-xs text-slate-500 mt-0.5">{sub}</div>}</div>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl leading-none ml-3">×</button>
        </div>
        <div className="flex-1 overflow-y-auto scrollbar">{children}</div>
      </div>
    </div>
  );
}

// 全局提示与确认
const Toast = { push: () => {} };
function Toasts() {
  const [items, setItems] = useState([]);
  useEffect(() => { Toast.push = (msg, kind = "ok") => { const id = Math.random(); setItems(x => [...x, { id, msg, kind }]); setTimeout(() => setItems(x => x.filter(i => i.id !== id)), kind === "err" ? 7000 : 3500); }; }, []);
  return <div className="fixed bottom-5 right-5 z-[60] space-y-2 w-96">{items.map(t =>
    <div key={t.id} className={`px-4 py-2.5 rounded-lg shadow-lg text-sm border ${t.kind === "err" ? "bg-rose-950 border-rose-700 text-rose-200" : t.kind === "warn" ? "bg-amber-950 border-amber-700 text-amber-200" : "bg-emerald-950 border-emerald-700 text-emerald-200"}`}>{t.msg}</div>)}</div>;
}
const ok = (m) => Toast.push(m, "ok"), fail = (m) => Toast.push(m, "err"), warn = (m) => Toast.push(m, "warn");

const Confirm = { ask: () => Promise.resolve(false) };
function ConfirmHost() {
  const [st, setSt] = useState(null); const [typed, setTyped] = useState("");
  useEffect(() => { Confirm.ask = (o) => new Promise(res => { setTyped(""); setSt({ ...o, res }); }); }, []);
  if (!st) return null;
  const close = (v) => { st.res(v); setSt(null); };
  const blocked = st.typeToConfirm && typed !== st.typeToConfirm;
  return (
    <Modal title={st.title || "请确认"} onClose={() => close(false)} footer={<>
      <Btn onClick={() => close(false)}>取消</Btn>
      <Btn color={st.danger ? "red" : "blue"} disabled={blocked} onClick={() => close(true)}>{st.okText || "确认"}</Btn></>}>
      <div className="text-sm text-slate-300 whitespace-pre-line">{st.message}</div>
      {st.list && st.list.length > 0 && <div className="mt-3 max-h-40 overflow-y-auto scrollbar bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-400">{st.list.join("、")}</div>}
      {st.typeToConfirm && <div className="mt-4"><div className="text-xs text-slate-400 mb-1">请输入 <span className="font-mono text-amber-300">{st.typeToConfirm}</span> 以确认</div>
        <input autoFocus value={typed} onChange={e => setTyped(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 font-mono" /></div>}
    </Modal>
  );
}

const Input = (p) => <input {...p} className={"bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:border-sky-500 disabled:opacity-50 " + (p.className || "")} />;
const Select = ({ children, ...p }) => <select {...p} className={"bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-sky-500 " + (p.className || "")}>{children}</select>;
const Field = ({ label, children, hint }) => <label className="block"><div className="text-xs text-slate-400 mb-1">{label}</div>{children}{hint && <div className="text-[11px] text-slate-500 mt-1">{hint}</div>}</label>;

// ============================================================
// 状态徽标
// ============================================================
const STATE = { running: ["运行中", "bg-emerald-500"], stopped: ["已停止", "bg-slate-500"], pending: ["启动中", "bg-amber-400 animate-pulse"], stopping: ["停止中", "bg-amber-400 animate-pulse"], "shutting-down": ["删除中", "bg-rose-400 animate-pulse"] };
const StateDot = ({ state }) => { const [t, c] = STATE[state] || [state, "bg-slate-500"]; return <span className="inline-flex items-center gap-1.5 whitespace-nowrap"><span className={`w-2 h-2 rounded-full ${c}`} />{t}</span>; };
const HEALTH = { ok: ["正常", "text-emerald-300 bg-emerald-500/10 border-emerald-500/30"], warn: ["警告", "text-amber-300 bg-amber-500/10 border-amber-500/30"], critical: ["严重", "text-rose-300 bg-rose-500/10 border-rose-500/40"], unknown: ["未知", "text-slate-400 bg-slate-500/10 border-slate-600"] };
const COMP = { compliant: ["合规", "text-emerald-300 bg-emerald-500/10 border-emerald-500/30"], drift: ["配置偏离", "text-amber-300 bg-amber-500/10 border-amber-500/30"], unmanaged: ["未配置", "text-slate-300 bg-slate-500/10 border-slate-600"], unknown: ["—", "text-slate-500 border-transparent"] };
const Pill = ({ map, k, title }) => { const [t, c] = map[k] || [k, ""]; return <span title={title} className={`px-1.5 py-0.5 rounded border text-[11px] whitespace-nowrap ${c}`}>{t}</span>; };
const LEVEL = { "低": "text-emerald-300 border-emerald-500/40", "中": "text-sky-300 border-sky-500/40", "高": "text-amber-300 border-amber-500/40", "最高": "text-rose-300 border-rose-500/40" };
const LevelTag = ({ level }) => level ? <span className={`text-[10px] px-1 rounded border ${LEVEL[level] || "text-slate-400 border-slate-600"}`}>{level}</span> : null;
const RULE = { allow: ["允许", "text-emerald-300"], disallow: ["默认禁止", "text-amber-300"], deny: ["强制禁止", "text-rose-300"] };

function Bar({ value, warnAt = 80, critAt = 92 }) {
  if (value === null || value === undefined) return <span className="text-slate-600">—</span>;
  const c = value >= critAt ? "bg-rose-500" : value >= warnAt ? "bg-amber-500" : "bg-sky-500";
  return <div className="flex items-center gap-1.5 min-w-[70px]"><div className="flex-1 h-1.5 bg-slate-800 rounded"><div className={`h-1.5 rounded ${c}`} style={{ width: Math.min(100, value) + "%" }} /></div><span className="text-[11px] text-slate-400 w-8 text-right">{value}%</span></div>;
}

// 可复用：按分组多选服务器（用于定时任务、应用模板等）
function ServerPicker({ servers, value, onChange, filter }) {
  const [q, setQ] = useState("");
  const list = servers.filter(s => (!filter || filter(s)) && (!q || [s.name, s.instance_id, s.group, s.assignee, s.department].join(" ").toLowerCase().includes(q.toLowerCase())));
  const groups = {}; list.forEach(s => { (groups[s.group || "未分组"] = groups[s.group || "未分组"] || []).push(s); });
  const toggle = (ids, on) => { const set = new Set(value); ids.forEach(i => on ? set.add(i) : set.delete(i)); onChange([...set]); };
  return (
    <div className="border border-slate-700 rounded-lg">
      <div className="flex items-center gap-2 p-2 border-b border-slate-700">
        <Input placeholder="搜索名称、使用人、部门" value={q} onChange={e => setQ(e.target.value)} className="flex-1" />
        <Btn small onClick={() => toggle(list.map(s => s.instance_id), true)}>全选结果</Btn>
        <Btn small onClick={() => onChange([])}>清空</Btn>
        <span className="text-xs text-slate-400 whitespace-nowrap">已选 {value.length} 台</span>
      </div>
      <div className="max-h-56 overflow-y-auto scrollbar p-2 space-y-2">
        {Object.keys(groups).sort().map(g => {
          const ids = groups[g].map(s => s.instance_id); const all = ids.every(i => value.includes(i));
          return <div key={g}>
            <label className="flex items-center gap-2 text-xs text-slate-400 mb-1 cursor-pointer"><input type="checkbox" checked={all} onChange={e => toggle(ids, e.target.checked)} />{g}（{ids.length}）</label>
            <div className="grid grid-cols-2 gap-1 pl-5">{groups[g].map(s =>
              <label key={s.instance_id} className={`flex items-center gap-2 px-2 py-1 rounded text-sm cursor-pointer ${value.includes(s.instance_id) ? "bg-sky-600/20" : "hover:bg-slate-800"}`}>
                <input type="checkbox" checked={value.includes(s.instance_id)} onChange={e => toggle([s.instance_id], e.target.checked)} />
                <span className="truncate">{s.name || s.instance_id}</span>{s.assignee && <span className="text-[11px] text-slate-500 truncate">{s.assignee}</span>}
              </label>)}</div>
          </div>;
        })}
        {list.length === 0 && <div className="text-center text-slate-500 text-sm py-4">没有匹配的服务器</div>}
      </div>
    </div>
  );
}

// 权限规则编辑器（模板与单台自定义共用）
function PermEditor({ features, spec, onChange, readOnly }) {
  const setAll = (r) => { const n = {}; features.groups.forEach(g => g.features.forEach(f => n[f.key] = r)); ["display", "keyboard", "mouse", "pointer"].forEach(k => n[k] = "allow"); onChange(n); };
  return (
    <div>
      {!readOnly && <div className="flex gap-2 mb-3 justify-end">
        <Btn small color="ghost" onClick={() => setAll("allow")}>全部允许</Btn>
        <Btn small color="ghost" onClick={() => setAll("disallow")}>全部默认禁止</Btn>
        <Btn small color="ghost" onClick={() => setAll("deny")}>全部强制禁止</Btn>
      </div>}
      <div className="grid md:grid-cols-2 gap-3">
        {features.groups.map(g => (
          <div key={g.group} className="bg-slate-800/40 border border-slate-700 rounded-xl p-3">
            <div className="text-xs font-medium text-slate-400 mb-2">{g.group}</div>
            <div className="space-y-1">{g.features.map(f => {
              const r = spec[f.key] || "allow";
              return <div key={f.key} className="flex items-center justify-between gap-2 text-sm">
                <span className="truncate" title={f.key}>{f.label}</span>
                {readOnly ? <span className={`text-xs ${RULE[r][1]}`}>{RULE[r][0]}</span> :
                  <select value={r} onChange={e => onChange({ ...spec, [f.key]: e.target.value })} className={`bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 text-xs ${RULE[r][1]}`}>
                    <option value="allow">允许</option><option value="disallow">默认禁止</option><option value="deny">强制禁止</option>
                  </select>}
              </div>;
            })}</div>
          </div>
        ))}
      </div>
      <div className="text-[11px] text-slate-500 mt-3">「默认禁止」可被其他规则放开；「强制禁止」不可被放开，适用于涉密场景。</div>
    </div>
  );
}
// ============================================================
// 服务器列表
// ============================================================
const COLS_KEY = "dcv_cols";
// 常用区域中文名（未列出的直接显示区域代码）
const REGION_ZH = { "eu-central-1": "法兰克福", "eu-west-1": "爱尔兰", "eu-west-2": "伦敦", "eu-west-3": "巴黎", "eu-north-1": "斯德哥尔摩", "eu-south-1": "米兰",
  "us-east-1": "弗吉尼亚北部", "us-east-2": "俄亥俄", "us-west-1": "加利福尼亚北部", "us-west-2": "俄勒冈", "ca-central-1": "加拿大中部", "sa-east-1": "圣保罗",
  "ap-northeast-1": "东京", "ap-northeast-2": "首尔", "ap-northeast-3": "大阪", "ap-southeast-1": "新加坡", "ap-southeast-2": "悉尼", "ap-south-1": "孟买",
  "ap-east-1": "香港", "me-central-1": "阿联酋", "il-central-1": "特拉维夫", "af-south-1": "开普敦" };
const regionName = (r) => r ? (REGION_ZH[r] ? `${REGION_ZH[r]}（${r}）` : r) : "—";
const regionShort = (r) => REGION_ZH[r] || r || "—";
const multiRegion = () => !!(CFG && CFG.regions && CFG.regions.length > 1);
// 机型单价（美元/小时，Windows 按需价格；不含磁盘、公网 IP 与流量）
let PRICES = {};
const WORK_HOURS = 176;   // 每天 8 小时 × 22 个工作日
const FULL_HOURS = 730;
const priceOf = (region, type) => { const r = PRICES[region || (CFG && CFG.region)] || {}; return r[type] ?? null; };
const usd = (v, d = 2) => v == null ? "—" : "$" + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(d));
const hourly = (p) => p == null ? "暂无报价" : `$${p.toFixed(3)}/小时`;
const diffPct = (p, base) => (p == null || !base) ? "" : (p === base ? "" : `${p > base ? "+" : ""}${Math.round((p / base - 1) * 100)}%`);
function PriceTag({ region, type, base, compact }) {
  const p = priceOf(region, type); if (p == null) return <span className="text-[11px] text-slate-500">暂无报价</span>;
  const b = base ? priceOf(region, base) : null; const d = diffPct(p, b);
  return <span className="text-[11px] text-slate-400 whitespace-nowrap" title={`按需价格（Windows）：${hourly(p)}；每天 8 小时×22 天约 ${usd(p * WORK_HOURS, 0)}/月，全天运行约 ${usd(p * FULL_HOURS, 0)}/月。不含磁盘、公网 IP 与流量费用。`}>
    {hourly(p)}{!compact && <> · 约 {usd(p * WORK_HOURS, 0)}/月</>}{d && <span className={`ml-1 ${p > b ? "text-amber-300" : "text-emerald-300"}`}>{d}</span>}</span>;
}
const capUrl = (region, refresh) => `/api/capacity?region=${encodeURIComponent(region || (CFG && CFG.region) || "")}${refresh ? "&refresh=1" : ""}`;

const ALL_COLS = [
  ["region", "区域"], ["group", "分组"], ["assignee", "使用人"], ["type", "机型"], ["uptime", "运行时长"], ["conn", "连接"],
  ["cpu", "CPU"], ["mem", "内存"], ["gpu", "显存"], ["disk", "磁盘"], ["perm", "权限配置"], ["share", "共享盘"], ["health", "健康"], ["ip", "公网 IP"],
];

function Summary({ s, setQuick, quick }) {
  const card = (key, label, value, cls, hint) => (
    <button onClick={() => setQuick(quick === key ? "" : key)} title={hint}
      className={`text-left rounded-xl border px-3.5 py-2.5 transition ${quick === key ? "border-sky-500 bg-sky-500/10" : "border-slate-700 bg-slate-900 hover:border-slate-500"}`}>
      <div className="text-[11px] text-slate-400">{label}</div><div className={`text-xl font-semibold mt-0.5 ${cls || ""}`}>{value}</div>
    </button>);
  return (
    <div className="grid grid-cols-4 lg:grid-cols-8 gap-2.5 mb-4">
      {card("", "全部服务器", s.total)}
      {card("running", "运行中", s.running, "text-emerald-300")}
      {card("stopped", "已停止", s.stopped, "text-slate-300")}
      {card("connected", "在线连接", s.connections, "text-sky-300", "当前正在连接 DCV 的会话数")}
      {card("critical", "严重告警", s.critical, s.critical ? "text-rose-400" : "", "开机失败（容量不足）、DCV 服务停止、没有用户会话等，用户无法使用")}
      {card("warn", "警告", s.warn, s.warn ? "text-amber-300" : "", "SSM 离线、磁盘不足、用户为管理员等")}
      {card("drift", "权限不合规", s.drift + s.unmanaged, (s.drift + s.unmanaged) ? "text-amber-300" : "", "主机实际配置与平台不一致、模板有更新或未配置权限")}
      {card("idle", "闲置", s.idle, s.idle ? "text-violet-300" : "", "运行中但长时间无人连接，建议关机节省费用")}
    </div>);
}

function ServersPage({ data, reload, features, templates, openServer }) {
  const [q, setQ] = useState(""); const [group, setGroup] = useState(""); const [dept, setDept] = useState("");
  const [tplF, setTplF] = useState(""); const [quick, setQuick] = useState(""); const [regionF, setRegionF] = useState("");
  const [sel, setSel] = useState([]); const [sort, setSort] = useState(["group", 1]);
  const [cols, setCols] = useState(() => JSON.parse(localStorage.getItem(COLS_KEY) || "null") || ALL_COLS.map(c => c[0]));
  const [dlg, setDlg] = useState(null); const [colMenu, setColMenu] = useState(false);
  useEffect(() => localStorage.setItem(COLS_KEY, JSON.stringify(cols)), [cols]);
  const all = data ? data.instances : [];
  const byId = useMemo(() => Object.fromEntries(all.map(i => [i.instance_id, i])), [all]);
  useEffect(() => setSel(s => s.filter(id => byId[id])), [byId]);

  const list = useMemo(() => {
    let l = all.filter(i => {
      if (regionF && i.region !== regionF) return false;
      if (group && (i.group || "未分组") !== group) return false;
      if (dept && i.department !== dept) return false;
      if (tplF === "__none" && i.perm_mode === "template") return false;
      if (tplF && tplF !== "__none" && String(i.template && i.template.id) !== tplF) return false;
      if (quick === "running" && i.state !== "running") return false;
      if (quick === "stopped" && i.state !== "stopped") return false;
      if (quick === "connected" && !((i.inspection || {}).connections > 0)) return false;
      if (quick === "critical" && i.health !== "critical") return false;
      if (quick === "warn" && i.health !== "warn") return false;
      if (quick === "drift" && !["drift", "unmanaged"].includes(i.compliance)) return false;
      if (quick === "idle" && !i.idle) return false;
      if (q) { const t = [i.name, i.instance_id, i.assignee, i.department, i.group, i.public_ip, i.private_ip, i.note, i.region, REGION_ZH[i.region], i.az].join(" ").toLowerCase(); if (!q.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false; }
      return true;
    });
    const [k, d] = sort; const val = (i) => ({ name: i.name, group: (i.group || "~") + i.name, assignee: i.assignee || "~", state: i.state, uptime: i.running_since || "", health: { critical: 0, warn: 1, ok: 2, unknown: 3 }[i.health], conn: -((i.inspection || {}).connections || 0), type: i.instance_type, region: (i.region || "") + i.az + i.name }[k] ?? i.name);
    return [...l].sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * d);
  }, [all, q, group, dept, tplF, quick, sort, regionF]);

  const selInst = sel.map(id => byId[id]).filter(Boolean);
  const allChecked = list.length > 0 && list.every(i => sel.includes(i.instance_id));
  const toggleAll = () => setSel(allChecked ? sel.filter(id => !list.some(i => i.instance_id === id)) : [...new Set([...sel, ...list.map(i => i.instance_id)])]);
  const th = (k, label, cls = "") => <th className={`px-2 py-2 text-left cursor-pointer select-none hover:text-slate-200 ${cls}`} onClick={() => setSort([k, sort[0] === k ? -sort[1] : 1])}>{label}{sort[0] === k ? (sort[1] > 0 ? " ↑" : " ↓") : ""}</th>;
  const show = (c) => cols.includes(c);

  async function batchPower(action) {
    const zh = { start: "开机", stop: "关机", reboot: "重启" }[action];
    const eligible = selInst.filter(i => action === "start" ? i.state === "stopped" : i.state === "running");
    const connected = selInst.filter(i => action !== "start" && (i.inspection || {}).connections > 0);
    if (!eligible.length) { warn(`所选服务器中没有可${zh}的（${action === "start" ? "需为已停止" : "需为运行中"}）`); return; }
    const msg = `将对 ${eligible.length} 台服务器执行${zh}` + (selInst.length > eligible.length ? `，另有 ${selInst.length - eligible.length} 台状态不符将跳过` : "") + "。"
      + (connected.length ? `\n\n注意：${connected.length} 台有用户正在连接，${zh}会中断其工作。` : "");
    if (action === "start") { setDlg("start"); return; }
    const needType = eligible.length >= 5;
    if (!await Confirm.ask({ title: `批量${zh}`, message: msg, list: eligible.map(i => i.name || i.instance_id), danger: true, okText: `确认${zh}`, typeToConfirm: needType ? String(eligible.length) : null })) return;
    try { const r = await post("/api/jobs/power", { instance_ids: selInst.map(i => i.instance_id), action }); ok(`已创建任务 #${r.job_id}，可在「任务中心」查看进度`); setSel([]); setTimeout(reload, 1500); }
    catch (e) { fail(e.message); }
  }
  async function batchShareSync() {
    try { const r = await post("/api/jobs/share-sync", { instance_ids: sel }); ok(`共享盘同步任务 #${r.job_id} 已开始，首次挂载需安装组件，约 1–2 分钟`); } catch (e) { fail(e.message); }
  }
  async function batchInspect() {
    try { const r = await post("/api/jobs/inspect", { instance_ids: sel }); ok(`巡检任务 #${r.job_id} 已开始`); setTimeout(reload, 8000); } catch (e) { fail(e.message); }
  }

  const s = data ? data.summary : null;
  return (
    <div>
      {data && data.region_errors && Object.keys(data.region_errors).length > 0 && <div className="mb-3 bg-amber-500/10 border border-amber-500/30 rounded-xl px-4 py-2 text-sm text-amber-200">
        以下区域读取失败，显示的是上次结果：{Object.entries(data.region_errors).map(([r, e]) => `${regionShort(r)}（${e.slice(0, 80)}）`).join("；")}</div>}
      {s && <Summary s={s} quick={quick} setQuick={setQuick} />}
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <Input placeholder="搜索名称、使用人、部门、IP、实例 ID" value={q} onChange={e => setQ(e.target.value)} className="w-72" />
        {multiRegion() && <Select value={regionF} onChange={e => setRegionF(e.target.value)}><option value="">全部区域</option>{CFG.regions.map(r => <option key={r} value={r}>{regionShort(r)}（{(s && s.regions && s.regions[r] ? s.regions[r].total : 0)} 台）</option>)}</Select>}
        <Select value={group} onChange={e => setGroup(e.target.value)}><option value="">全部分组</option>{s && s.groups.map(g => <option key={g}>{g}</option>)}<option value="未分组">未分组</option></Select>
        <Select value={dept} onChange={e => setDept(e.target.value)}><option value="">全部部门</option>{s && s.departments.map(g => <option key={g}>{g}</option>)}</Select>
        <Select value={tplF} onChange={e => setTplF(e.target.value)}><option value="">全部权限配置</option>{templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}<option value="__none">未使用模板</option></Select>
        {(q || group || dept || tplF || quick || regionF) && <Btn small color="ghost" onClick={() => { setQ(""); setGroup(""); setDept(""); setTplF(""); setQuick(""); setRegionF(""); }}>清除筛选</Btn>}
        <div className="ml-auto flex items-center gap-2 relative">
          <span className="text-xs text-slate-500">显示 {list.length} / {all.length} 台 · {data ? "更新于 " + new Date(data.generated_at * 1000).toLocaleTimeString("zh-CN", { hour12: false }) : ""}</span>
          <Btn small color="ghost" onClick={() => setColMenu(!colMenu)}>列设置</Btn>
          {colMenu && <div className="absolute right-0 top-8 z-20 bg-slate-900 border border-slate-700 rounded-lg p-2 shadow-xl w-40" onMouseLeave={() => setColMenu(false)}>
            {ALL_COLS.map(([k, l]) => <label key={k} className="flex items-center gap-2 px-1 py-0.5 text-sm cursor-pointer"><input type="checkbox" checked={show(k)} onChange={e => setCols(e.target.checked ? [...cols, k] : cols.filter(c => c !== k))} />{l}</label>)}
          </div>}
        </div>
      </div>

      {sel.length > 0 && <div className="sticky top-0 z-10 flex flex-wrap items-center gap-2 bg-sky-950/90 backdrop-blur border border-sky-800 rounded-xl px-3 py-2 mb-3">
        <span className="text-sm font-medium mr-1">已选 {sel.length} 台</span>
        {can("operator") && <>
          <Btn small color="green" onClick={() => batchPower("start")}>开机</Btn>
          <Btn small color="red" onClick={() => batchPower("stop")}>关机</Btn>
          <Btn small color="amber" onClick={() => batchPower("reboot")}>重启</Btn>
          <span className="w-px h-5 bg-sky-800 mx-1" />
          <Btn small color="indigo" onClick={() => setDlg("template")}>应用权限模板</Btn>
          <Btn small onClick={() => setDlg("tags")}>设置分组/使用人</Btn>
          <Btn small onClick={batchInspect}>立即巡检</Btn>
          <Btn small onClick={batchShareSync} title="按平台配置挂载/卸载共享盘">同步共享盘</Btn>
          <Btn small onClick={() => setDlg("fallback")} title="开机容量不足时自动改用的机型">备选机型</Btn>
        </>}
        {can("admin") && <Btn small onClick={() => setDlg("migrate")} title="整机迁移到有容量的可用区（需已关机）">迁移可用区</Btn>}
        {can("admin") && <Btn small color="red" onClick={() => setDlg("terminate")} title="终止实例，不可恢复">删除服务器</Btn>}
        {can("admin") && <Btn small onClick={() => setDlg("schedule")}>创建定时任务</Btn>}
        <Btn small color="ghost" onClick={() => exportCsv(selInst)}>导出所选</Btn>
        <button className="ml-auto text-xs text-slate-400 hover:text-white" onClick={() => setSel([])}>取消选择</button>
      </div>}

      <div className="bg-slate-900 border border-slate-700 rounded-xl overflow-x-auto scrollbar">
        <table className="w-full text-sm">
          <thead className="text-xs text-slate-400 border-b border-slate-700">
            <tr>
              <th className="pl-3 pr-1 py-2 w-8"><input type="checkbox" checked={allChecked} onChange={toggleAll} /></th>
              {th("name", "名称")}{th("state", "状态")}
              {show("region") && multiRegion() && th("region", "区域")}
              {show("group") && th("group", "分组")}{show("assignee") && th("assignee", "使用人")}{show("type") && th("type", "机型")}
              {show("uptime") && th("uptime", "运行时长")}{show("conn") && th("conn", "连接")}
              {show("cpu") && <th className="px-2 py-2 text-left">CPU</th>}{show("mem") && <th className="px-2 py-2 text-left">内存</th>}
              {show("gpu") && <th className="px-2 py-2 text-left">显存</th>}{show("disk") && <th className="px-2 py-2 text-left">磁盘</th>}
              {show("perm") && <th className="px-2 py-2 text-left">权限配置</th>}{show("share") && <th className="px-2 py-2 text-left">共享盘</th>}{show("health") && th("health", "健康")}
              {show("ip") && <th className="px-2 py-2 text-left">公网 IP</th>}
              <th className="px-2 py-2 text-right pr-3">操作</th>
            </tr>
          </thead>
          <tbody>
            {list.map(i => <ServerRow key={i.instance_id} i={i} show={show} checked={sel.includes(i.instance_id)}
              onCheck={v => setSel(v ? [...sel, i.instance_id] : sel.filter(x => x !== i.instance_id))} onOpen={() => openServer(i.instance_id)} reload={reload} />)}
            {!data && <tr><td colSpan="20" className="text-center text-slate-500 py-12">加载中…</td></tr>}
            {data && list.length === 0 && <tr><td colSpan="20" className="text-center text-slate-500 py-12">{all.length ? "没有符合筛选条件的服务器" : `未发现纳管服务器。给 EC2 实例打上标签 dcv=true 后刷新，或在「快照与镜像」中创建。`}</td></tr>}
          </tbody>
        </table>
      </div>

      {dlg === "template" && <ApplyTemplateDialog servers={selInst} templates={templates} features={features} onClose={() => setDlg(null)} onDone={() => { setSel([]); setDlg(null); setTimeout(reload, 1500); }} />}
      {dlg === "start" && <StartDialog servers={selInst} onClose={() => setDlg(null)} onDone={() => { setSel([]); setDlg(null); setTimeout(reload, 1500); }} />}
      {dlg === "tags" && <TagsDialog servers={selInst} summary={s} onClose={() => setDlg(null)} onDone={() => { setDlg(null); reload(); }} />}
      {dlg === "fallback" && <FallbackDialog servers={selInst} onClose={() => setDlg(null)} onDone={() => { setDlg(null); reload(); }} />}
      {dlg === "terminate" && <TerminateDialog servers={selInst} onClose={() => setDlg(null)} onDone={() => { setSel([]); setDlg(null); setTimeout(reload, 2000); }} />}
      {dlg === "migrate" && <MigrateDialog servers={selInst} onClose={() => setDlg(null)} onDone={() => { setSel([]); setDlg(null); setTimeout(reload, 1500); }} />}
      {dlg === "schedule" && <ScheduleDialog servers={all} preselect={sel} onClose={() => setDlg(null)} onDone={() => setDlg(null)} />}
    </div>
  );
}

function ServerRow({ i, show, checked, onCheck, onOpen, reload }) {
  const x = (i.inspection && !i.inspection.stale) ? i.inspection : null;
  const memPct = x ? pct(x.mem_total_mb - x.mem_free_mb, x.mem_total_mb) : null;
  const gpuPct = x ? pct(x.gpu_mem_used, x.gpu_mem_total) : null;
  const diskPct = x ? pct(x.disk_total_gb - x.disk_free_gb, x.disk_total_gb) : null;
  const tip = [...i.alerts.map(a => a.message), ...i.compliance_reasons].join("\n");
  const power = async (e, action) => {
    e.stopPropagation(); const zh = { start: "开机", stop: "关机" }[action];
    if (action === "stop" && !await Confirm.ask({ title: "关机", message: `确认关闭 ${i.name}？` + ((x && x.connections) ? `\n\n当前有 ${x.connections} 个用户正在连接，关机会中断其工作。` : ""), danger: true, okText: "确认关机" })) return;
    try { await post(`/api/instances/${i.instance_id}/power`, { action }); ok(`${i.name} ${zh}指令已提交`); setTimeout(reload, 1500); } catch (err) { fail(err.message); }
  };
  return (
    <tr className={`border-b border-slate-800 hover:bg-slate-800/50 cursor-pointer ${checked ? "row-sel" : ""}`} onClick={onOpen}>
      <td className="pl-3 pr-1 py-2" onClick={e => e.stopPropagation()}><input type="checkbox" checked={checked} onChange={e => onCheck(e.target.checked)} /></td>
      <td className="px-2 py-2 max-w-[220px]"><div className="font-medium truncate">{i.name || "（未命名）"}</div><div className="text-[11px] text-slate-500 font-mono">{i.instance_id}</div></td>
      <td className="px-2 py-2 whitespace-nowrap"><StateDot state={i.state} />{i.busy && <span className="ml-1.5 text-[10px] text-sky-300">任务中</span>}</td>
      {show("region") && multiRegion() && <td className="px-2 py-2 whitespace-nowrap text-slate-300">{regionShort(i.region)}<div className="text-[11px] text-slate-500">{i.az}</div></td>}
      {show("group") && <td className="px-2 py-2 whitespace-nowrap text-slate-300">{i.group || <span className="text-slate-600">—</span>}</td>}
      {show("assignee") && <td className="px-2 py-2 whitespace-nowrap"><div>{i.assignee || <span className="text-slate-600">—</span>}</div>{i.department && <div className="text-[11px] text-slate-500">{i.department}</div>}</td>}
      {show("type") && <td className="px-2 py-2 whitespace-nowrap text-slate-300">{i.instance_type}<div className="text-[11px] text-slate-500">{i.cpu}C / {gib(i.memory_mib)}{priceOf(i.region, i.instance_type) != null && ` · $${priceOf(i.region, i.instance_type).toFixed(3)}/时`}</div></td>}
      {show("uptime") && <td className="px-2 py-2 whitespace-nowrap text-slate-300">{uptimeOf(i)}{i.idle && <div className="text-[11px] text-violet-300">闲置</div>}</td>}
      {show("conn") && <td className="px-2 py-2 text-center">{x ? (x.connections > 0 ? <span className="text-sky-300 font-medium">{x.connections}</span> : <span className="text-slate-500">0</span>) : <span className="text-slate-600">—</span>}</td>}
      {show("cpu") && <td className="px-2 py-2"><Bar value={x ? x.cpu : null} /></td>}
      {show("mem") && <td className="px-2 py-2"><Bar value={memPct} /></td>}
      {show("gpu") && <td className="px-2 py-2"><Bar value={gpuPct} /></td>}
      {show("disk") && <td className="px-2 py-2"><Bar value={diskPct} warnAt={85} critAt={92} /></td>}
      {show("perm") && <td className="px-2 py-2 whitespace-nowrap">
        {i.template ? <span className="inline-flex items-center gap-1">{i.template.name}<LevelTag level={i.template.level} /></span> : i.perm_mode === "custom" ? <span className="text-slate-300">自定义</span> : <span className="text-slate-500">未配置</span>}
        {i.compliance !== "unknown" && <div className="mt-0.5"><Pill map={COMP} k={i.compliance} title={i.compliance_reasons.join("\n")} /></div>}
      </td>}
      {show("share") && <td className="px-2 py-2 whitespace-nowrap"><ShareChips rows={i.shares} /></td>}
      {show("health") && <td className="px-2 py-2 whitespace-nowrap" title={tip}><Pill map={HEALTH} k={i.health} />{i.alerts.length > 0 && <span className="text-[11px] text-slate-500 ml-1">{i.alerts.length}</span>}</td>}
      {show("ip") && <td className="px-2 py-2 font-mono text-xs text-slate-400">{i.public_ip || "—"}</td>}
      <td className="px-2 py-2 pr-3 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}>
        {i.dcv_url && i.state === "running" && <a href={i.dcv_url} target="_blank" className="text-xs text-sky-400 hover:underline mr-2">连接</a>}
        {can("operator") && (i.state === "stopped" ? <Btn small color={i.start_failed ? "amber" : "green"} onClick={e => { if (i.start_failed) { e.stopPropagation(); onOpen(); } else power(e, "start"); }} disabled={i.busy}>{i.start_failed ? "开机失败" : "开机"}</Btn>
          : i.state === "running" ? <Btn small color="ghost" onClick={e => power(e, "stop")} disabled={i.busy}>关机</Btn> : null)}
      </td>
    </tr>
  );
}

function exportCsv(rows) {
  const head = ["名称", "实例ID", "状态", "区域", "可用区", "分组", "使用人", "部门", "机型", "vCPU", "内存GiB", "显存GiB", "公网IP", "私网IP", "权限模板", "合规", "健康", "告警", "当前连接", "运行时长", "备注"];
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = rows.map(i => [i.name, i.instance_id, (STATE[i.state] || [i.state])[0], i.region, i.az, i.group, i.assignee, i.department, i.instance_type, i.cpu,
    i.memory_mib ? (i.memory_mib / 1024).toFixed(0) : "", i.gpu_memory_mib ? (i.gpu_memory_mib / 1024).toFixed(1) : "", i.public_ip, i.private_ip,
    i.template ? i.template.name : (i.perm_mode === "custom" ? "自定义" : "未配置"), COMP[i.compliance][0], HEALTH[i.health][0],
    [...i.alerts.map(a => a.message), ...i.compliance_reasons].join("；"), (i.inspection || {}).connections ?? "", uptimeOf(i), i.note].map(esc).join(","));
  const blob = new Blob(["\ufeff" + [head.map(esc).join(","), ...lines].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `DCV服务器清单_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

function ApplyTemplateDialog({ servers, templates, features, onClose, onDone }) {
  const [tid, setTid] = useState(templates[0] ? templates[0].id : ""); const [busy, setBusy] = useState(false);
  const t = templates.find(x => x.id === Number(tid));
  const stopped = servers.filter(s => s.state !== "running"); const offline = servers.filter(s => s.state === "running" && s.ssm !== "Online");
  const connected = servers.filter(s => (s.inspection || {}).connections > 0);
  const go = async () => {
    setBusy(true);
    try { const r = await post("/api/jobs/apply-template", { instance_ids: servers.map(s => s.instance_id), template_id: Number(tid) }); ok(`已创建任务 #${r.job_id}：应用「${t.name}」到 ${servers.length} 台`); onDone(); }
    catch (e) { fail(e.message); setBusy(false); }
  };
  return (
    <Modal title={`应用权限模板到 ${servers.length} 台服务器`} onClose={onClose} width="max-w-3xl" footer={<><Btn onClick={onClose}>取消</Btn><Btn color="indigo" onClick={go} disabled={!t || busy}>{busy ? "提交中…" : "确认应用"}</Btn></>}>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">{templates.map(x =>
        <button key={x.id} onClick={() => setTid(x.id)} className={`text-left rounded-lg border p-2.5 ${Number(tid) === x.id ? "border-indigo-500 bg-indigo-500/10" : "border-slate-700 hover:border-slate-500"}`}>
          <div className="flex items-center gap-1.5 text-sm font-medium">{x.name}<LevelTag level={x.level} /></div>
          <div className="text-[11px] text-slate-500 mt-1 line-clamp-2">{x.description}</div>
        </button>)}</div>
      {t && <><div className="text-xs text-slate-400 mb-2">「{t.name}」包含的规则（v{t.version}）</div><PermEditor features={features} spec={t.spec} readOnly /></>}
      <div className="mt-4 space-y-1 text-xs">
        {stopped.length > 0 && <div className="text-amber-300">· {stopped.length} 台未运行，将跳过（开机后可重新应用）：{stopped.map(s => s.name).join("、")}</div>}
        {offline.length > 0 && <div className="text-amber-300">· {offline.length} 台 SSM 离线，将无法下发：{offline.map(s => s.name).join("、")}</div>}
        {connected.length > 0 && <div className="text-rose-300">· {connected.length} 台有用户正在连接，应用时会重建会话，用户需重新连接：{connected.map(s => s.name).join("、")}</div>}
        <div className="text-slate-500">· 平台会在每台主机上核对权限文件与会话属主，核对通过才算成功，结果可在「任务中心」查看。</div>
      </div>
    </Modal>
  );
}

function TagsDialog({ servers, summary, onClose, onDone }) {
  const one = servers.length === 1 ? servers[0] : null;
  const [f, setF] = useState({ group: one ? one.group : "", assignee: one ? one.assignee : "", department: one ? one.department : "", note: one ? one.note : "" });
  const [touched, setTouched] = useState({}); const [busy, setBusy] = useState(false);
  const set = (k, v) => { setF({ ...f, [k]: v }); setTouched({ ...touched, [k]: true }); };
  const go = async () => {
    const body = { instance_ids: servers.map(s => s.instance_id) }; Object.keys(touched).forEach(k => body[k] = f[k]);
    if (Object.keys(touched).length === 0) { onClose(); return; }
    setBusy(true); try { await post("/api/instances/tags", body); ok(`已更新 ${servers.length} 台服务器`); onDone(); } catch (e) { fail(e.message); setBusy(false); }
  };
  return (

function PermTab({ inst, features, templates, reload }) {
  const iid = inst.instance_id;
  const [spec, setSpec] = useState(null); const [saved, setSaved] = useState(null); const [owner, setOwner] = useState(""); const [busy, setBusy] = useState(false); const [result, setResult] = useState(null);
  // 只在切换服务器时加载一次，列表定时刷新不会覆盖正在编辑的内容
  useEffect(() => { api(`/api/instances/${iid}/dcv/permissions`).then(d => { setSpec(d.spec); setSaved(d.spec); setOwner(d.owner || ""); }).catch(e => fail(e.message)); }, [iid]);
  if (!spec) return <div className="text-slate-500 text-center py-10">加载中…</div>;
  const dirty = Object.keys(spec).some(k => spec[k] !== saved[k]);
  const matchTpl = templates.find(t => features.groups.every(g => g.features.every(f => (t.spec[f.key] || "allow") === (spec[f.key] || "allow"))));
  const disabled = !can("operator") || inst.state !== "running" || inst.busy;
  const labelOf = (k) => { for (const g of features.groups) for (const f of g.features) if (f.key === k) return f.label; return k; };
  const save = async () => {
    setBusy(true); setResult(null);
    try {
      if (matchTpl) { const r = await post("/api/jobs/apply-template", { instance_ids: [iid], template_id: matchTpl.id, owner: owner || null }); ok(`与模板「${matchTpl.name}」一致，已按模板应用（任务 #${r.job_id}）`); setSaved(spec); setTimeout(reload, 20000); }
      else { const d = await post(`/api/instances/${iid}/dcv/permissions`, { spec, owner: owner || null }); setSaved(spec); setResult(d); d.verified ? ok("已在主机上生效并核对通过") : fail("已下发，但主机核对未通过"); reload(); }
    } catch (e) { fail(e.message); } finally { setBusy(false); }
  };
  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <span className="text-sm text-slate-400">从模板载入：</span>
        {templates.map(t => <button key={t.id} onClick={() => setSpec({ ...t.spec })} className={`text-xs px-2 py-1 rounded border ${matchTpl && matchTpl.id === t.id ? "border-indigo-500 bg-indigo-500/15" : "border-slate-700 hover:border-slate-500"}`}>{t.name}</button>)}
      </div>
      <PermEditor features={features} spec={spec} onChange={setSpec} readOnly={!can("operator")} />
      <div className="flex items-center gap-3 mt-4">
        <Field label="会话属主（Windows 用户）"><Input value={owner} onChange={e => setOwner(e.target.value)} placeholder="dcvuser" className="w-40" disabled={!can("operator")} /></Field>
        <div className="flex-1 text-xs text-slate-400 pt-4">{matchTpl ? <>当前配置与模板「<span className="text-indigo-300">{matchTpl.name}</span>」一致，保存后该服务器将绑定此模板。</> : "当前为自定义配置，不绑定任何模板。"}</div>
      </div>
      <div className="flex items-center gap-3 mt-4 pt-4 border-t border-slate-800">
        <Btn color="indigo" onClick={save} disabled={disabled || busy}>{busy ? "下发中…（约 15 秒）" : "保存并下发到主机"}</Btn>
        {dirty && !busy && <span className="text-xs text-amber-300">有未下发的修改</span>}
        {inst.state !== "running" && <span className="text-xs text-slate-500">服务器未运行，无法下发</span>}
        {inst.busy && <span className="text-xs text-slate-500">有任务正在执行</span>}
      </div>
      {result && <div className={`mt-3 text-sm rounded-lg px-3 py-2 border ${result.verified ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-200" : "bg-rose-500/10 border-rose-500/40 text-rose-200"}`}>
        {result.verified ? `已在主机上生效（已核对权限文件与会话，属主 ${result.owner}）。受限功能：${result.restricted.length ? result.restricted.map(labelOf).join("、") : "无"}。已连接的用户需断开重连后生效。`
          : `主机核对未通过：${!result.file_ok ? "权限文件内容不一致；" : ""}${!result.session_ok ? "会话未按属主重建；" : ""}请重试或在「运维操作」中查看会话状态。`}
      </div>}
    </div>
  );
}

function genPassword(len = 16) {
  const sets = ["ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnopqrstwxyz", "23456789", "#@%!&*+=?"]; const all = sets.join("");
  const r = new Uint32Array(len * 2); crypto.getRandomValues(r); const c = sets.map((s, i) => s[r[i] % s.length]);
  for (let i = 4; c.length < len; i++) c.push(all[r[i] % all.length]);
  for (let i = c.length - 1; i > 0; i--) { const j = r[len + i] % (i + 1); [c[i], c[j]] = [c[j], c[i]]; }
  const p = c.join(""); return /dcv|user|remote|access/i.test(p) ? genPassword(len) : p;
}

// ============================================================
// 定时任务（EventBridge Scheduler）
// ============================================================
let CFG = null;
const WEEK = [["MON", "一"], ["TUE", "二"], ["WED", "三"], ["THU", "四"], ["FRI", "五"], ["SAT", "六"], ["SUN", "日"]];
const WEEK_ZH = Object.fromEntries(WEEK);
const ACT = { start: ["开机", "text-emerald-300"], stop: ["关机", "text-rose-300"], reboot: ["重启", "text-amber-300"] };
function parseCron(c) {
  const p = (c || "").trim().split(/\s+/); if (p.length !== 6) return { freq: "custom" };
  const [m, h, dom, , dow] = p; if (!/^\d+$/.test(m) || !/^\d+$/.test(h)) return { freq: "custom" };
  const time = `${h.padStart(2, "0")}:${m.padStart(2, "0")}`;
  if (dom === "*" && dow === "?") return { freq: "daily", time };
  if (dom === "?" && dow === "MON-FRI") return { freq: "weekdays", time };
  if (dom === "?" && /^[A-Z]{3}(,[A-Z]{3})*$/.test(dow)) return { freq: "weekly", time, days: dow.split(",") };
  return { freq: "custom" };
}
function buildCron(freq, time, days) {
  const [h, m] = (time || "09:00").split(":").map(Number);
  if (freq === "daily") return `${m} ${h} * * ? *`;
  if (freq === "weekdays") return `${m} ${h} ? * MON-FRI *`;
  return `${m} ${h} ? * ${(days && days.length ? days : ["MON"]).join(",")} *`;
}
function cronText(c) {
  const p = parseCron(c);
  if (p.freq === "daily") return `每天 ${p.time}`;
  if (p.freq === "weekdays") return `工作日 ${p.time}`;
  if (p.freq === "weekly") return `每周${p.days.map(d => WEEK_ZH[d]).join("、")} ${p.time}`;
  return `cron(${c})`;
}

function ScheduleDialog({ servers, preselect, existing, onClose, onDone }) {
  const init = existing ? parseCron(existing.cron) : { freq: "weekdays", time: "08:30" };
  const [action, setAction] = useState(existing ? existing.action : "workhours");
  const [freq, setFreq] = useState(init.freq); const [time, setTime] = useState(init.time || "09:00"); const [days, setDays] = useState(init.days || ["MON"]);
  const [custom, setCustom] = useState(existing ? existing.cron : "0 9 ? * MON-FRI *");
  const [onT, setOnT] = useState("08:30"); const [offT, setOffT] = useState("19:00");
  const [note, setNote] = useState(existing ? existing.note : ""); const [sel, setSel] = useState(existing ? existing.instance_ids : (preselect || []));
  const [busy, setBusy] = useState(false);
  const tz = (CFG && CFG.scheduler_tz) || "Asia/Shanghai";
  const cron = freq === "custom" ? custom : buildCron(freq, time, days);
  const freqPart = freq === "custom" ? `cron(${custom})` : cronText(buildCron(freq, "00:00", days)).replace(" 00:00", "");
  const go = async () => {
    if (!sel.length) { fail("请至少选择一台服务器"); return; }
    setBusy(true);
    try {
      if (existing) { await put(`/api/schedules/${existing.name}`, { action, cron, note, instance_ids: sel }); ok("定时任务已更新"); }
      else if (action === "workhours") {
        if (freq === "custom") { fail("上下班计划请选择每天、工作日或每周"); setBusy(false); return; }
        await post("/api/schedules", { instance_ids: sel, action: "start", cron: buildCron(freq, onT, days), note: (note ? note + " · " : "") + "上班开机" });
        await post("/api/schedules", { instance_ids: sel, action: "stop", cron: buildCron(freq, offT, days), note: (note ? note + " · " : "") + "下班关机" });
        ok(`已创建上下班计划（${sel.length} 台）` + (new Set(sel.map(id => (servers.find(x => x.instance_id === id) || {}).region)).size > 1 ? "，已按区域拆分" : ""));
      } else { const r = await post("/api/schedules", { instance_ids: sel, action, cron, note }); ok(r.message || "定时任务已创建"); }
      onDone && onDone();
    } catch (e) { fail(e.message); setBusy(false); }
  };
  return (
    <Modal title={existing ? "编辑定时任务" : "创建定时任务"} onClose={onClose} width="max-w-3xl" footer={<><Btn onClick={onClose}>取消</Btn><Btn color="blue" onClick={go} disabled={busy}>{busy ? "保存中…" : "保存"}</Btn></>}>
      <div className="grid grid-cols-3 gap-3 mb-3">
        <Field label="动作"><Select value={action} onChange={e => setAction(e.target.value)} className="w-full">
          {!existing && <option value="workhours">上下班计划（开机 + 关机）</option>}
          <option value="start">开机</option><option value="stop">关机</option><option value="reboot">重启</option></Select></Field>
        <Field label="频率"><Select value={freq} onChange={e => setFreq(e.target.value)} className="w-full">
          <option value="weekdays">工作日（周一至周五）</option><option value="daily">每天</option><option value="weekly">每周指定日</option>{action !== "workhours" && <option value="custom">自定义 Cron</option>}</Select></Field>
        {action === "workhours" ? <div className="grid grid-cols-2 gap-2">
          <Field label="开机时间"><Input type="time" value={onT} onChange={e => setOnT(e.target.value)} className="w-full" /></Field>
          <Field label="关机时间"><Input type="time" value={offT} onChange={e => setOffT(e.target.value)} className="w-full" /></Field></div>
          : <Field label="时间"><Input type="time" value={time} onChange={e => setTime(e.target.value)} disabled={freq === "custom"} className="w-full" /></Field>}
      </div>
      {freq === "weekly" && <div className="flex gap-1.5 mb-3">{WEEK.map(([k, z]) => <button key={k} onClick={() => setDays(days.includes(k) ? days.filter(d => d !== k) : [...days, k])} className={`w-9 h-8 rounded text-sm ${days.includes(k) ? "bg-sky-600" : "bg-slate-800"}`}>{z}</button>)}</div>}
      {freq === "custom" && <Field label="AWS Cron 表达式（分 时 日 月 周 年；日与周其一须为 ?）"><Input value={custom} onChange={e => setCustom(e.target.value)} className="w-full font-mono mb-3" /></Field>}
      <div className="text-xs text-slate-400 bg-slate-800/50 rounded-lg px-3 py-2 mb-3">
        将执行：{action === "workhours" ? `${freqPart} ${onT} 开机，${offT} 关机` : `${freq === "custom" ? `cron(${custom})` : cronText(cron)} ${ACT[action][0]}`}（时区 {tz}）· 由 AWS EventBridge Scheduler 托管执行，管理平台关闭不影响触发
      </div>
      <Field label="目标服务器"><ServerPicker servers={servers} value={sel} onChange={setSel} /></Field>
      <div className="mt-3"><Field label="备注"><Input value={note} onChange={e => setNote(e.target.value)} placeholder="如：设计中心工作时间" className="w-full" /></Field></div>
    </Modal>
  );
}

function TemplateEditor({ tpl, features, servers, onClose, onSaved }) {
  const [name, setName] = useState(tpl.name || ""); const [level, setLevel] = useState(tpl.level || "中"); const [desc, setDesc] = useState(tpl.description || "");

      const body = { name, level, description: desc, spec };
      const t = tpl.id ? await put(`/api/templates/${tpl.id}`, body) : await post("/api/templates", body);
      ok(tpl.id ? `已保存为 v${t.version}` : "模板已创建");
      const reapply = boundN > 0 && await Confirm.ask({ title: "重新应用", message: `${boundN} 台服务器正在使用此模板。修改后它们的实际权限不会自动变化，是否现在重新应用？`, okText: "选择服务器并应用" });
      onSaved(t, reapply);

        <Field label="安全等级"><Select value={level} onChange={e => setLevel(e.target.value)} className="w-full">{["低", "中", "高", "最高"].map(l => <option key={l}>{l}</option>)}</Select></Field>

function ApplyToServersDialog({ template, servers, onlyBound, onClose, onDone }) {
  const boundIds = servers.filter(s => s.template && s.template.id === template.id).map(s => s.instance_id);
  const outdatedIds = servers.filter(s => s.template && s.template.id === template.id && s.template.outdated).map(s => s.instance_id);
  const [sel, setSel] = useState(onlyBound ? boundIds : []); const [busy, setBusy] = useState(false);
  const picked = servers.filter(s => sel.includes(s.instance_id));
  const stopped = picked.filter(s => s.state !== "running").length; const conn = picked.filter(s => (s.inspection || {}).connections > 0);
  const go = async () => {
    if (!sel.length) { fail("请至少选择一台服务器"); return; }
    if (conn.length && !await Confirm.ask({ title: "有用户正在连接", message: `${conn.length} 台服务器有用户正在使用，应用权限会重建 DCV 会话，这些用户需要重新连接。是否继续？`, list: conn.map(s => `${s.name}（${s.assignee || "未知使用人"}）`), okText: "继续应用" })) return;

    <Modal title={`应用「${template.name}」到服务器`} onClose={onClose} width="max-w-3xl" footer={<><Btn onClick={onClose}>取消</Btn><Btn color="indigo" onClick={go} disabled={busy || !sel.length}>应用到 {sel.length} 台</Btn></>}>

function ShareDialog({ share, servers, shares, drives, onClose, onDone }) {
  const editing = !!share;
  const used = shares.filter(s => !share || s.id !== share.id).map(s => s.drive);
  const freeDrive = [...drives].reverse().find(d => !used.includes(d) && !["C", "D"].includes(d)) || "S";
  const [f, setF] = useState(share ? { ...share } : { name: "", bucket: "", prefix: "", drive: freeDrive, mode: "rw", scope: "selected", cache_gb: 20, kms_key: "" });
  const [newBucket, setNewBucket] = useState(false); const [buckets, setBuckets] = useState(null); const [sel, setSel] = useState([]); const [busy, setBusy] = useState(false);
  const set = (k, v) => setF({ ...f, [k]: v });
  useEffect(() => { if (!editing) api("/api/shares/buckets").then(d => setBuckets(d.buckets)).catch(() => setBuckets([])); }, []);
  const b = buckets && buckets.find(x => x.name === f.bucket);
  const crossRegion = b && CFG && b.region !== CFG.region;
  const go = async () => {
    setBusy(true);
    try {
      if (editing) {
        const body = {}; ["name", "drive", "mode", "scope", "cache_gb"].forEach(k => { if (f[k] !== share[k]) body[k] = f[k]; });
        if (!Object.keys(body).length) { onClose(); return; }
        if (body.scope === "all" && !await Confirm.ask({ title: "改为全部服务器", message: `所有纳管服务器（${servers.length} 台，包括以后新建的）都将能访问 ${share.path}。确认？`, okText: "确认" })) { setBusy(false); return; }
        if (body.mode === "ro" && !await Confirm.ask({ title: "改为只读", message: "改为只读后，服务器上缓存中尚未上传的文件会先等待上传完成再重新挂载。确认？", okText: "确认" })) { setBusy(false); return; }
        onDone(await put(`/api/shares/${share.id}`, body));
      } else {
        if (f.scope === "all" && !await Confirm.ask({ title: "对全部服务器生效", message: `所有纳管服务器（${servers.length} 台，包括以后新建的）都会挂载此共享盘。确认？`, okText: "确认" })) { setBusy(false); return; }
        onDone(await post("/api/shares", { ...f, create_bucket: newBucket, instance_ids: f.scope === "selected" ? sel : [] }));
      }
    } catch (e) { fail(e.message); setBusy(false); }
  };
  return (

            {newBucket ? <Input value={f.bucket} onChange={e => set("bucket", e.target.value.toLowerCase())} placeholder="全球唯一，如 corp-dcv-share-2026" className="w-full font-mono" />
              : <><Input list="dl-buckets" value={f.bucket} onChange={e => set("bucket", e.target.value.toLowerCase())} placeholder={buckets ? "选择或输入存储桶名称" : "读取中…"} className="w-full font-mono" />
                <datalist id="dl-buckets">{(buckets || []).map(x => <option key={x.name} value={x.name}>{x.region}</option>)}</datalist></>}</Field></div>

        </>}
        {editing && <div className="col-span-6 text-xs text-slate-400 bg-slate-800/50 rounded-lg px-3 py-2 font-mono">{share.path}（{share.region}）· 存储位置创建后不能修改</div>}

        {!editing && <div className="col-span-4"><Field label="KMS 密钥 ARN（可选）" hint="存储桶使用自定义 KMS 密钥加密时填写，平台会授予服务器使用该密钥的权限"><Input value={f.kms_key} onChange={e => set("kms_key", e.target.value)} className="w-full font-mono" /></Field></div>}

function ShareTargetsDialog({ share, servers, onClose, onDone }) {
  const [sel, setSel] = useState(share.target_ids); const [busy, setBusy] = useState(false);
  const add = sel.filter(i => !share.target_ids.includes(i)); const remove = share.target_ids.filter(i => !sel.includes(i));
  const name = (id) => (servers.find(s => s.instance_id === id) || {}).name || id;
  const go = async () => {
    if (!add.length && !remove.length) { onClose(); return; }
    if (remove.length && !await Confirm.ask({ title: "取消授权", message: `${remove.length} 台服务器将卸载 ${share.drive}: 并失去访问权限（未上传的文件会先写回 S3）：`, list: remove.map(name), danger: true, okText: "确认" })) return;
    setBusy(true);
    try { const r = await post(`/api/shares/${share.id}/targets`, { add, remove }); ok(`授权已更新${r.job_id ? `，同步任务 #${r.job_id} 已开始` : ""}`); onDone(); } catch (e) { fail(e.message); setBusy(false); }
  };
  return (
    <Modal title={`授权服务器 · ${share.name}（${share.drive}:）`} onClose={onClose} width="max-w-3xl" footer={<>
      <span className="text-xs text-slate-400 mr-auto self-center">{add.length ? `新增 ${add.length} 台` : ""}{add.length && remove.length ? "，" : ""}{remove.length ? `移除 ${remove.length} 台` : ""}</span>
      <Btn onClick={onClose}>取消</Btn><Btn color="blue" onClick={go} disabled={busy}>保存</Btn></>}>
      <ServerPicker servers={servers} value={sel} onChange={setSel} />
      <div className="text-xs text-slate-500 mt-3">未授权的服务器即使手动配置挂载，S3 也会拒绝访问。</div>
    </Modal>
  );
}

const CAP = { available: ["有容量", "text-emerald-300", "bg-emerald-500/15 border-emerald-500/40"], likely: ["大概率可用", "text-sky-300", "bg-sky-500/10 border-sky-500/30"],
  limited: ["紧张", "text-amber-300", "bg-amber-500/10 border-amber-500/30"], unavailable: ["容量不足", "text-rose-300", "bg-rose-500/15 border-rose-500/40"],
  unknown: ["未知", "text-slate-400", "bg-slate-800/40 border-slate-700"], not_offered: ["不提供", "text-slate-600", "bg-transparent border-slate-800"] };

function CapacityPage({ servers: allServers }) {
  const [region, setRegion] = useState((CFG && CFG.region) || "");
